<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF8E7">
  <title>DeruXeon — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pop-yellow: #FFD93D;
      --pop-pink:   #FF6B9D;
      --pop-blue:   #4ECDC4;
      --pop-red:    #FF5252;
      --pop-purple: #A78BFA;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --font-display: 'Bangers', 'Impact', cursive;
      --font-body:    'Nunito', system-ui, -apple-system, sans-serif;
      --app-max-width: 430px;
      --app-pad: 1.25rem;
      --nav-height: 76px;
    }
    :root, [data-theme="light"] {
      --ink: #1A1A1A;
      --paper: #FFF8E7;
      --paper-dark: #F5EBD0;
      --color-text-muted: #5A5A5A;
      --border-thick: 3px solid var(--ink);
      --border-thicker: 4px solid var(--ink);
      --shadow-comic: 5px 5px 0 var(--ink);
      --shadow-comic-sm: 3px 3px 0 var(--ink);
      --halftone: rgba(26,26,26,0.08);
      --error: #D92D20;
      --success: #059669;
    }
    [data-theme="dark"] {
      --ink: #F2EDE0;
      --paper: #15130F;
      --paper-dark: #221F18;
      --color-text-muted: #A8A296;
      --border-thick: 3px solid var(--ink);
      --border-thicker: 4px solid var(--ink);
      --shadow-comic: 5px 5px 0 rgba(242,237,224,0.9);
      --shadow-comic-sm: 3px 3px 0 rgba(242,237,224,0.9);
      --halftone: rgba(242,237,224,0.06);
      --error: #FF8A80;
      --success: #6EE7B7;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(circle at 1px 1px, var(--halftone) 1px, transparent 0);
      background-size: 12px 12px;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      transition: background-color 0.35s ease, color 0.35s ease;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--ink);
    }
    p { line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input { font-family: inherit; font-size: inherit; color: inherit; }
    a, button, [role="button"] { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--pop-blue); outline-offset: 3px; }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    .hidden { display: none !important; }

    .app-shell {
      width: 100%;
      max-width: var(--app-max-width);
      min-height: 100dvh;
      padding-inline: var(--app-pad);
      padding-top: var(--space-md);
      padding-bottom: calc(var(--nav-height) + var(--space-md));
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    /* TOPBAR */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-sm);
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .topbar-avatar {
      width: 44px; height: 44px;
      border-radius: 50%;
      background: var(--pop-blue);
      border: var(--border-thick);
      box-shadow: var(--shadow-comic-sm);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 1.3rem;
      color: #1A1A1A;
      flex-shrink: 0;
    }
    .topbar-info { min-width: 0; }
    .topbar-name {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.03em;
      line-height: 1.1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .topbar-role {
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-top: 2px;
    }
    .topbar-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: var(--pop-yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-comic-sm);
      display: flex; align-items: center; justify-content: center;
      color: var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .icon-btn:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .icon-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .icon-btn svg { width: 20px; height: 20px; }

    /* MAIN */
    .main { flex: 1; display: flex; flex-direction: column; gap: var(--space-md); }
    .screen-panel { display: none; flex-direction: column; gap: var(--space-md); }
    .screen-panel.active { display: flex; }

    /* GREET */
    .greet-card {
      padding: var(--space-md);
      background: var(--pop-yellow);
      border: var(--border-thicker);
      border-radius: 18px;
      box-shadow: var(--shadow-comic);
      transform: rotate(-0.5deg);
    }
    .greet-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      letter-spacing: 0.04em;
      color: #1A1A1A;
      line-height: 1.1;
    }
    .greet-sub {
      font-size: 0.78rem;
      font-weight: 700;
      color: #1A1A1A;
      opacity: 0.8;
      margin-top: 4px;
    }
    .greet-badge {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.6rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      background: #1A1A1A;
      color: var(--pop-yellow);
      padding: 4px 10px;
      border-radius: 4px;
    }

    /* STATS */
    .stats-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .stat-card {
      padding: 14px 8px;
      background: var(--paper);
      border: var(--border-thick);
      border-radius: 12px;
      box-shadow: var(--shadow-comic-sm);
      text-align: center;
    }
    .stat-icon {
      width: 26px; height: 26px;
      margin: 0 auto 6px;
      color: var(--ink);
    }
    .stat-icon svg { width: 100%; height: 100%; stroke-width: 2; }
    .stat-num {
      font-family: var(--font-display);
      font-size: 1.3rem;
      letter-spacing: 0.04em;
      line-height: 1;
    }
    .stat-lbl {
      font-size: 0.58rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--color-text-muted);
      margin-top: 3px;
    }

    /* SECTION BLOCK */
    .section-block {
      background: var(--paper);
      border: var(--border-thick);
      border-radius: 14px;
      box-shadow: var(--shadow-comic-sm);
      overflow: hidden;
    }
    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      background: var(--pop-pink);
      border-bottom: var(--border-thick);
      color: #1A1A1A;
    }
    .section-head h2 {
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #1A1A1A;
    }
    .section-head svg { width: 18px; height: 18px; color: #1A1A1A; }
    .section-body {
      padding: 16px;
      font-size: 0.82rem;
      color: var(--color-text-muted);
      line-height: 1.7;
      min-height: 80px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* PLACEHOLDER */
    .placeholder {
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      border: 3px dashed var(--ink);
      border-radius: 14px;
      color: var(--color-text-muted);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: var(--paper-dark);
    }
    .placeholder svg {
      width: 48px; height: 48px;
      margin: 0 auto 12px;
      opacity: 0.4;
      display: block;
    }

    /* BOTTOM NAV */
    .bottom-nav {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 1.5rem);
      max-width: calc(var(--app-max-width) - 1.5rem);
      height: var(--nav-height);
      background: var(--paper);
      border: var(--border-thicker);
      border-radius: 22px;
      box-shadow: var(--shadow-comic);
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 6px;
      z-index: 150;
    }
    .nav-item {
      flex: 1;
      height: 100%;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      color: var(--ink);
      transition: background-color 0.2s ease, transform 0.15s ease;
    }
    .nav-item svg { width: 22px; height: 22px; stroke-width: 2; }
    .nav-item span {
      font-size: 0.55rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .nav-item.active {
      background: var(--pop-yellow);
      border: 2px solid var(--ink);
      box-shadow: 2px 2px 0 var(--ink);
    }
    .nav-item:active { transform: scale(0.92); }
    .nav-item:not(.active):hover { background: var(--paper-dark); }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: calc(var(--nav-height) + 24px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--paper);
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.8rem; font-weight: 700;
      border: var(--border-thick); border-color: var(--paper);
      box-shadow: var(--shadow-comic-sm);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 300;
      max-width: calc(100% - 2rem);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--error); color: #fff; border-color: #fff; }
    .toast.success { background: var(--success); color: #fff; border-color: #fff; }

    /* LOADING OVERLAY */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--paper);
      background-image: radial-gradient(circle at 1px 1px, var(--halftone) 1px, transparent 0);
      background-size: 12px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--space-md);
      z-index: 500;
      transition: opacity 0.4s ease;
    }
    .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    .loading-spinner {
      width: 54px; height: 54px;
      border: 5px solid var(--paper-dark);
      border-top-color: var(--pop-blue);
      border-right-color: var(--pop-pink);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text {
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.08em;
      text-shadow: 2px 2px 0 var(--pop-yellow);
    }
    .loading-sub {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--color-text-muted);
    }

    /* ERROR CARD */
    .error-card {
      padding: var(--space-lg) var(--space-md);
      background: var(--paper);
      border: var(--border-thicker);
      border-radius: 16px;
      box-shadow: var(--shadow-comic);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: var(--space-sm);
      align-items: center;
    }
    .error-card .icon {
      width: 54px; height: 54px;
      color: var(--pop-red);
    }
    .error-card h2 {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--ink);
    }
    .error-card p {
      font-size: 0.82rem;
      color: var(--color-text-muted);
    }
    .btn-retry {
      padding: 12px 22px;
      border-radius: 10px;
      background: var(--pop-yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-comic-sm);
      font-family: var(--font-display);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
      color: #1A1A1A;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      margin-top: 6px;
    }
    .btn-retry:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn-retry:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  </style>
</head>
<body>

  <!-- LOADING OVERLAY -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Memuat…</div>
    <div class="loading-sub" id="loadingSub">Menghubungkan ke server</div>
  </div>

  <div class="app-shell">

    <!-- TOPBAR -->
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-avatar" id="userAvatar">?</div>
        <div class="topbar-info">
          <div class="topbar-name" id="userName">—</div>
          <div class="topbar-role" id="userRole">—</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="themeToggle" aria-label="Ganti tema">
          <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
          </svg>
          <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
        <button class="icon-btn" id="btnLogout" aria-label="Logout" style="background:var(--pop-red);color:#fff">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- MAIN -->
    <main class="main" id="mainContent">

      <!-- SCREEN: DASHBOARD -->
      <section class="screen-panel active" data-screen="dashboard">
        <div class="greet-card">
          <div class="greet-title" id="greetTitle">Halo!</div>
          <div class="greet-sub" id="greetSub">Selamat datang di DeruXeon</div>
          <span class="greet-badge" id="greetBadge">USER</span>
        </div>

        <div class="stats-row">
          <div class="stat-card">
            <div class="stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <div class="stat-num" id="statFollowers">0</div>
            <div class="stat-lbl">Followers</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
            </div>
            <div class="stat-num" id="statLikes">0</div>
            <div class="stat-lbl">Likes</div>
          </div>
          <div class="stat-card">
            <div class="stat-icon">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="8.5" cy="7" r="4"/>
                <line x1="20" y1="8" x2="20" y2="14"/>
                <line x1="23" y1="11" x2="17" y2="11"/>
              </svg>
            </div>
            <div class="stat-num" id="statFollowing">0</div>
            <div class="stat-lbl">Following</div>
          </div>
        </div>

        <div class="section-block">
          <div class="section-head">
            <h2>Events</h2>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
          </div>
          <div class="section-body" id="eventsBody">Belum ada event.</div>
        </div>

        <div class="section-block">
          <div class="section-head" style="background:var(--pop-blue)">
            <h2>Berita Terkini</h2>
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                 fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
          </div>
          <div class="section-body" id="newsBody">Belum ada berita.</div>
        </div>
      </section>

      <!-- SCREEN: SOCIAL -->
      <section class="screen-panel" data-screen="social">
        <div class="placeholder">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          Menu Social<br>(global post & private chat)
        </div>
      </section>

      <!-- SCREEN: PREMIUM -->
      <section class="screen-panel" data-screen="premium">
        <div class="placeholder">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
          Menu Premium<br>(verifikasi, badge, mode silit)
        </div>
      </section>

      <!-- SCREEN: SETTINGS -->
      <section class="screen-panel" data-screen="settings">
        <div class="placeholder">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"/>

  <!-- Supabase SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <script>
    /* ============================================================
       BAGIAN 1 — UI (jalan duluan, gak butuh Supabase)
       ============================================================ */
    let toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = 'toast ' + type, 3000);
    }

    // --- THEME ---
    (function themeModule() {
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');
      const sun = document.getElementById('iconSun');
      const moon = document.getElementById('iconMoon');
      const meta = document.querySelector('meta[name="theme-color"]');
      const KEY = 'dx_theme';

      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        sun.classList.toggle('hidden', isDark);
        moon.classList.toggle('hidden', !isDark);
        btn.setAttribute('aria-label', isDark ? 'Ganti ke tema terang' : 'Ganti ke tema gelap');
        if (meta) meta.setAttribute('content', isDark ? '#15130F' : '#FFF8E7');
      }
      const saved = localStorage.getItem(KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));
      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(KEY, next);
      });
    })();

    // --- BOTTOM NAV ---
    (function navModule() {
      const navItems = document.querySelectorAll('.nav-item');
      const panels = document.querySelectorAll('.screen-panel');

      navItems.forEach(item => {
        item.addEventListener('click', () => {
          const target = item.dataset.target;
          navItems.forEach(n => n.classList.toggle('active', n === item));
          panels.forEach(p => p.classList.toggle('active', p.dataset.screen === target));
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });
      });
    })();

    /* ============================================================
       BAGIAN 2 — SUPABASE
       ============================================================ */
    const SUPABASE_URL      = 'https://lxdjnzsbunkkwjkltabt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_W9AFHz0Z3M0YhpVRgLsbbQ_L8iUd-q1';

    let supaClient = null;
    let supaReady  = false;

    function initSupa() {
      return new Promise((resolve) => {
        if (supaReady && supaClient) { resolve(true); return; }
        let tries = 0;
        const maxTries = 80;
        const timer = setInterval(() => {
          tries++;
          if (window.supabase && typeof window.supabase.createClient === 'function') {
            clearInterval(timer);
            try {
              supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
              supaReady = true;
              console.log('[DeruXeon] Supabase ready.');
              resolve(true);
            } catch (e) {
              console.error('[DeruXeon] createClient error:', e);
              resolve(false);
            }
            return;
          }
          if (tries >= maxTries) {
            clearInterval(timer);
            console.error('[DeruXeon] SDK timeout.');
            resolve(false);
          }
        }, 100);
      });
    }

    /* ============================================================
       BAGIAN 3 — HELPERS
       ============================================================ */
    function hideLoading() {
      const overlay = document.getElementById('loadingOverlay');
      if (overlay) {
        overlay.classList.add('fade-out');
        setTimeout(() => overlay.remove(), 400);
      }
    }

    function setLoadingSub(text) {
      const el = document.getElementById('loadingSub');
      if (el) el.textContent = text;
    }

    function showErrorScreen(title, message, showRetry = true) {
      hideLoading();
      const main = document.getElementById('mainContent');
      if (!main) return;
      main.innerHTML = `
        <div class="error-card">
          <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="8" x2="12" y2="12"/>
            <line x1="12" y1="16" x2="12.01" y2="16"/>
          </svg>
          <h2>${title}</h2>
          <p>${message}</p>
          ${showRetry ? '<button class="btn-retry" id="btnRetry">COBA LAGI</button>' : ''}
        </div>
      `;
      if (showRetry) {
        document.getElementById('btnRetry').addEventListener('click', () => location.reload());
      }
    }

    /* ============================================================
       BAGIAN 4 — BOOT DASHBOARD
       ============================================================ */
    async function bootDashboard() {
      setLoadingSub('Menghubungkan ke server');

      // 1. Init Supabase
      const ok = await initSupa();
      if (!ok) {
        showErrorScreen(
          'Koneksi Gagal',
          'Tidak bisa terhubung ke server. Periksa koneksi internet kamu.'
        );
        return;
      }

      // 2. Cek session
      setLoadingSub('Memeriksa sesi');
      let session = null;
      try {
        const { data, error } = await supaClient.auth.getSession();
        if (error) throw error;
        session = data.session;
      } catch (e) {
        console.error('[DeruXeon] getSession:', e);
        showErrorScreen('Sesi Error', 'Gagal memeriksa sesi login kamu.');
        return;
      }

      // Belum login → balik ke login
      if (!session) {
        setLoadingSub('Mengalihkan ke login');
        window.location.href = 'login.html';
        return;
      }

      const user = session.user;

      // 3. Ambil profile
      setLoadingSub('Memuat profil');
      let profile = null;
      try {
        const { data, error } = await supaClient
          .from('profiles')
          .select('nickname, wa, telegram, role')
          .eq('id', user.id)
          .maybeSingle();
        if (!error) profile = data;
        else console.warn('[DeruXeon] profile error:', error);
      } catch (e) {
        console.warn('[DeruXeon] profile fetch:', e);
      }

      const nickname = profile?.nickname
                    || user.user_metadata?.nickname
                    || (user.email ? user.email.split('@')[0] : 'User');
      const role = profile?.role || 'user';

      // 4. Isi UI
      const setText = (id, val) => {
        const el = document.getElementById(id);
        if (el) el.textContent = val;
      };

      setText('userAvatar', nickname.charAt(0).toUpperCase());
      setText('userName', nickname);
      setText('userRole', role.toUpperCase());
      setText('greetTitle', `Halo, ${nickname}!`);
      setText('greetBadge', role.toUpperCase());

      // 5. Selesai — sembunyikan loading
      hideLoading();

      // 6. Listener auth
      try {
        supaClient.auth.onAuthStateChange((event) => {
          if (event === 'SIGNED_OUT') {
            window.location.href = 'login.html';
          }
        });
      } catch (e) {
        console.warn('[DeruXeon] auth listener:', e);
      }
    }

    /* ============================================================
       BAGIAN 5 — JALANKAN
       ============================================================ */
    // Tunggu DOM ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootDashboard);
    } else {
      bootDashboard();
    }

    /* ============================================================
       BAGIAN 6 — LOGOUT
       ============================================================ */
    document.getElementById('btnLogout').addEventListener('click', async () => {
      if (!supaReady || !supaClient) {
        toast('Server belum siap.', 'error');
        return;
      }
      const btn = document.getElementById('btnLogout');
      btn.disabled = true;
      try {
        const { error } = await supaClient.auth.signOut();
        if (error) {
          toast('Logout gagal: ' + error.message, 'error');
          btn.disabled = false;
          return;
        }
        toast('Berhasil logout.', 'success');
        setTimeout(() => window.location.href = 'login.html', 600);
      } catch (e) {
        toast('Error logout.', 'error');
        btn.disabled = false;
      }
    });
  </script>
