<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF8E7">
  <title>DeruXeon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --pop-yellow: #FFD93D;
      --pop-pink:   #FF6B9D;
      --pop-blue:   #4ECDC4;
      --pop-red:    #FF5252;
      --pop-purple: #A78BFA;
      --space-xs: 0.5rem;
      --space-sm: 1rem;
      --space-md: 1.5rem;
      --space-lg: 2.5rem;
      --font-display: 'Bangers', 'Impact', cursive;
      --font-body:    'Nunito', system-ui, -apple-system, sans-serif;
      --app-max-width: 430px;
      --app-pad: 1.25rem;
    }
    :root, [data-theme="light"] {
      --ink: #1A1A1A;
      --paper: #FFF8E7;
      --paper-dark: #F5EBD0;
      --color-text-muted: #5A5A5A;
      --border-thick: 3px solid var(--ink);
      --border-thicker: 4px solid var(--ink);
      --shadow-comic: 5px 5px 0 var(--ink);
      --shadow-comic-sm: 3px 3px 0 var(--ink);
      --halftone: rgba(26,26,26,0.08);
      --error: #D92D20;
      --success: #059669;
    }
    [data-theme="dark"] {
      --ink: #F2EDE0;
      --paper: #15130F;
      --paper-dark: #221F18;
      --color-text-muted: #A8A296;
      --border-thick: 3px solid var(--ink);
      --border-thicker: 4px solid var(--ink);
      --shadow-comic: 5px 5px 0 rgba(242,237,224,0.9);
      --shadow-comic-sm: 3px 3px 0 rgba(242,237,224,0.9);
      --halftone: rgba(242,237,224,0.06);
      --error: #FF8A80;
      --success: #6EE7B7;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      font-weight: 600;
      font-size: 16px;
      line-height: 1.6;
      color: var(--ink);
      background-color: var(--paper);
      background-image: radial-gradient(circle at 1px 1px, var(--halftone) 1px, transparent 0);
      background-size: 12px 12px;
      -webkit-font-smoothing: antialiased;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      transition: background-color 0.35s ease, color 0.35s ease;
    }
    h1, h2, h3, h4, h5, h6 {
      font-family: var(--font-display);
      font-weight: 400;
      letter-spacing: 0.04em;
      line-height: 1;
      color: var(--ink);
    }
    p { line-height: 1.7; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input { font-family: inherit; font-size: inherit; color: inherit; }
    a, button, [role="button"] { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--pop-blue); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
    .hidden { display: none !important; }

    .app-shell {
      width: 100%;
      max-width: var(--app-max-width);
      min-height: 100dvh;
      padding-inline: var(--app-pad);
      padding-block: var(--space-md);
      position: relative;
      display: flex;
      flex-direction: column;
    }
    .screen {
      min-height: calc(100dvh - var(--space-md) * 2);
      display: flex;
      flex-direction: column;
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    .theme-toggle {
      position: fixed;
      top: 14px; right: 14px;
      width: 44px; height: 44px;
      border-radius: 12px;
      background: var(--pop-yellow);
      border: var(--border-thick);
      box-shadow: var(--shadow-comic-sm);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .theme-toggle:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .theme-toggle:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .theme-toggle svg { width: 22px; height: 22px; color: var(--ink); }

    #screen-initialized {
      align-items: center; justify-content: center;
      text-align: center; gap: var(--space-md);
    }
    #screen-initialized.is-leaving {
      opacity: 0; transform: translateY(-12px) rotate(-1deg);
      pointer-events: none;
    }
    .init-logo {
      width: 110px; height: 110px;
      border-radius: 18px;
      background: var(--pop-yellow);
      border: var(--border-thicker);
      box-shadow: var(--shadow-comic);
      display: flex; align-items: center; justify-content: center;
      transform: rotate(-3deg);
      animation: logoWobble 2.6s ease-in-out infinite;
      position: relative;
    }
    .init-logo::before {
      content: ''; position: absolute; inset: -14px;
      background: var(--pop-pink); border-radius: 18px;
      z-index: -1; transform: rotate(6deg);
      border: var(--border-thick);
    }
    .init-logo svg { width: 56px; height: 56px; color: var(--ink); stroke-width: 2.2; }
    @keyframes logoWobble {
      0%, 100% { transform: rotate(-3deg) scale(1); }
      50%      { transform: rotate(-1deg) scale(1.04); }
    }
    .init-title {
      font-family: var(--font-display);
      font-size: 3rem;
      letter-spacing: 0.06em;
      text-shadow: 3px 3px 0 var(--pop-yellow);
      transform: rotate(-1deg);
      line-height: 1;
    }
    .init-sub {
      display: inline-block; margin-top: var(--space-xs);
      font-size: 0.7rem; font-weight: 800;
      letter-spacing: 0.18em; text-transform: uppercase;
      background: var(--ink); color: var(--paper);
      padding: 5px 12px; border-radius: 4px;
      transform: rotate(1.5deg);
    }
    .init-progress { width: 100%; max-width: 280px; margin-top: var(--space-sm); }
    .progress-track {
      width: 100%; height: 26px;
      border-radius: 6px;
      background: var(--paper-dark);
      border: var(--border-thicker);
      box-shadow: var(--shadow-comic-sm);
      overflow: hidden; position: relative;
    }
    .progress-fill {
      width: 0%; height: 100%;
      background: repeating-linear-gradient(-45deg,
        var(--pop-blue), var(--pop-blue) 8px,
        var(--pop-purple) 8px, var(--pop-purple) 16px);
      transition: width 0.25s ease;
      position: relative;
    }
    .progress-fill::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.35), transparent);
      animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }
    .progress-meta {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: var(--space-sm);
      font-size: 0.72rem; font-weight: 800;
      letter-spacing: 0.05em; text-transform: uppercase;
    }
    .progress-meta .percent {
      font-family: var(--font-display);
      font-size: 1.1rem;
      background: var(--pop-yellow);
      padding: 2px 10px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      transform: rotate(-2deg);
      font-variant-numeric: tabular-nums;
      color: #1A1A1A;
    }
    .init-status {
      font-size: 0.7rem; font-weight: 700;
      color: var(--color-text-muted);
      min-height: 1rem;
      font-style: italic;
    }

    #screen-landing { gap: var(--space-md); padding-top: var(--space-lg); }
    #screen-landing.is-entering { opacity: 0; transform: translateY(12px); }

    .brand {
      display: flex; flex-direction: column;
      align-items: center; gap: var(--space-sm);
      text-align: center;
    }
    .brand-logo {
      width: 88px; height: 88px;
      border-radius: 16px;
      background: var(--pop-pink);
      border: var(--border-thicker);
      box-shadow: var(--shadow-comic);
      display: flex; align-items: center; justify-content: center;
      transform: rotate(-2deg);
    }
    .brand-logo svg { width: 46px; height: 46px; color: var(--ink); stroke-width: 2.2; }
    .brand-title {
      font-family: var(--font-display);
      font-size: 3.4rem;
      letter-spacing: 0.04em;
      text-shadow: 3px 3px 0 var(--pop-yellow);
      transform: rotate(-1deg);
      line-height: 1;
    }
    .brand-tagline {
      font-size: 0.75rem; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase;
      color: var(--color-text-muted);
      margin-top: -4px;
    }
    .btn-google {
      width: 100%;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; padding: 14px 18px;
      border-radius: 10px;
      background: var(--paper);
      border: var(--border-thick);
      box-shadow: var(--shadow-comic-sm);
      font-weight: 800; font-size: 0.9rem;
      color: var(--ink);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-google:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn-google:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .btn-google svg { width: 20px; height: 20px; }
    .divider {
      display: flex; align-items: center;
      gap: var(--space-sm);
      font-size: 0.7rem; font-weight: 800;
      letter-spacing: 0.1em; text-transform: uppercase;
      color: var(--color-text-muted);
    }
    .divider::before, .divider::after {
      content: ''; flex: 1; height: 2px;
      background: var(--ink); opacity: 0.2;
    }
    .auth-form { display: flex; flex-direction: column; gap: var(--space-sm); }
    .field label {
      display: block;
      font-size: 0.68rem; font-weight: 800;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink); margin-bottom: 6px;
    }
    .field input {
      width: 100%; padding: 13px 14px;
      border-radius: 10px;
      border: var(--border-thick);
      background: var(--paper);
      color: var(--ink);
      font-size: 0.9rem; font-weight: 600;
      outline: none;
      box-shadow: var(--shadow-comic-sm);
      transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.15s ease;
    }
    .field input::placeholder { color: var(--color-text-muted); opacity: 0.7; }
    .field input:focus { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--pop-blue); }
    .field.has-error input { border-color: var(--error); box-shadow: 3px 3px 0 var(--error); }
    .field-error {
      display: none;
      font-size: 0.7rem; font-weight: 700;
      color: var(--error);
      margin-top: 5px;
      letter-spacing: 0.02em;
    }
    .field.has-error .field-error { display: block; }
    .pw-wrap { position: relative; }
    .pw-wrap input { padding-right: 46px; }
    .pw-toggle {
      position: absolute; top: 50%; right: 10px;
      transform: translateY(-50%);
      width: 30px; height: 30px;
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink);
    }
    .pw-toggle svg { width: 18px; height: 18px; }
    .btn-submit {
      width: 100%; padding: 15px;
      border-radius: 10px;
      background: var(--pop-yellow);
      border: var(--border-thicker);
      box-shadow: var(--shadow-comic);
      font-family: var(--font-display);
      font-size: 1.4rem;
      letter-spacing: 0.06em;
      color: #1A1A1A;
      margin-top: var(--space-xs);
      transition: transform 0.12s ease, box-shadow 0.12s ease, opacity 0.15s ease;
      display: flex; align-items: center; justify-content: center;
      gap: 10px;
    }
    .btn-submit:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--ink); }
    .btn-submit:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .btn-submit:disabled { opacity: 0.7; cursor: not-allowed; }
    .spinner { width: 20px; height: 20px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .auth-note {
      text-align: center;
      font-size: 0.72rem; font-weight: 600;
      color: var(--color-text-muted);
      margin-top: var(--space-xs);
    }
    .auth-note a {
      font-weight: 800; color: var(--ink);
      text-decoration: underline;
      text-decoration-thickness: 2px;
      text-underline-offset: 2px;
    }
    #screen-dashboard {
      align-items: center; justify-content: center;
      text-align: center; gap: var(--space-md);
    }
    .dash-card {
      width: 100%;
      padding: var(--space-lg) var(--space-md);
      background: var(--paper);
      border: var(--border-thicker);
      border-radius: 16px;
      box-shadow: var(--shadow-comic);
      display: flex; flex-direction: column;
      align-items: center; gap: var(--space-sm);
    }
    .dash-avatar {
      width: 80px; height: 80px;
      border-radius: 50%;
      background: var(--pop-blue);
      border: var(--border-thicker);
      box-shadow: var(--shadow-comic-sm);
      display: flex; align-items: center; justify-content: center;
      font-family: var(--font-display);
      font-size: 2.4rem;
      color: #1A1A1A;
    }
    .dash-title {
      font-family: var(--font-display);
      font-size: 2rem;
      letter-spacing: 0.04em;
      text-shadow: 2px 2px 0 var(--pop-yellow);
    }
    .dash-meta {
      font-size: 0.75rem;
      color: var(--color-text-muted);
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .dash-badge {
      display: inline-block;
      font-size: 0.65rem; font-weight: 800;
      letter-spacing: 0.15em; text-transform: uppercase;
      background: var(--pop-yellow);
      color: #1A1A1A;
      padding: 4px 12px;
      border: 2px solid var(--ink);
      border-radius: 4px;
      transform: rotate(-1.5deg);
    }
    .btn-logout {
      width: 100%; padding: 13px;
      border-radius: 10px;
      background: var(--pop-red);
      border: var(--border-thick);
      box-shadow: var(--shadow-comic-sm);
      font-weight: 800; font-size: 0.9rem;
      color: #fff;
      transition: transform 0.12s ease, box-shadow 0.12s ease;
    }
    .btn-logout:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); }
    .btn-logout:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .toast {
      position: fixed;
      bottom: 20px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--ink); color: var(--paper);
      padding: 12px 18px;
      border-radius: 10px;
      font-size: 0.8rem; font-weight: 700;
      border: var(--border-thick); border-color: var(--paper);
      box-shadow: var(--shadow-comic-sm);
      opacity: 0; pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 200;
      max-width: calc(100% - 2rem);
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--error); color: #fff; border-color: #fff; }
    .toast.success { background: var(--success); color: #fff; border-color: #fff; }
  </style>
</head>
<body>

  <button class="theme-toggle" id="themeToggle" aria-label="Ganti tema">
    <svg id="iconSun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
    </svg>
    <svg id="iconMoon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
         fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </svg>
  </button>

  <div class="app-shell">

    <section id="screen-initialized" class="screen" aria-label="Inisialisasi server">
      <div class="init-logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
             fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7 4h5a8 8 0 0 1 0 16H7z"/>
          <path d="M17.5 5.5l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/>
        </svg>
      </div>
      <div>
        <h1 class="init-title">Initialized</h1>
        <p class="init-sub">DeruXeon Server</p>
      </div>
      <div class="init-progress">
        <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"
             aria-valuenow="0" aria-label="Progres loading server" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <div class="progress-meta">
          <span id="initStatus" class="init-status">Menyiapkan server…</span>
          <span class="percent" id="progressPercent">0%</span>
        </div>
      </div>
    </section>

    <section id="screen-landing" class="screen hidden is-entering" aria-label="Landing & Login">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 4h5a8 8 0 0 1 0 16H7z"/>
            <path d="M17.5 5.5l.9 1.9 1.9.9-1.9.9-.9 1.9-.9-1.9-1.9-.9 1.9-.9z"/>
          </svg>
        </div>
        <h1 class="brand-title">DeruXeon</h1>
        <p class="brand-tagline">Community · Premium · Private</p>
      </div>

      <button type="button" class="btn-google" id="btnGoogle">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1A11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/>
        </svg>
        Lanjutkan dengan Google
      </button>

      <div class="divider">atau daftar dengan email</div>

      <form class="auth-form" id="authForm" novalidate>
        <div class="field" id="field-email">
          <label for="fEmail">Email</label>
          <input id="fEmail" name="email" type="email" autocomplete="email" placeholder="kamu@email.com" required>
          <span class="field-error" id="err-email"></span>
        </div>
        <div class="field" id="field-nick">
          <label for="fNick">Nickname</label>
          <input id="fNick" name="nickname" type="text" autocomplete="nickname" placeholder="Nama panggilan" required maxlength="24">
          <span class="field-error" id="err-nick"></span>
        </div>
        <div class="field" id="field-wa">
          <label for="fWa">No. WhatsApp Aktif</label>
          <input id="fWa" name="wa" type="tel" inputmode="numeric" autocomplete="tel" placeholder="08xxxxxxxxxx" required>
          <span class="field-error" id="err-wa"></span>
        </div>
        <div class="field" id="field-tg">
          <label for="fTg">Telegram Link</label>
          <input id="fTg" name="telegram" type="text" autocomplete="off" placeholder="t.me/namatelekamu" required>
          <span class="field-error" id="err-tg"></span>
        </div>
        <div class="field" id="field-pass">
          <label for="fPass">Password</label>
          <div class="pw-wrap">
            <input id="fPass" name="password" type="password" autocomplete="new-password" placeholder="••••••••" required minlength="6">
            <button type="button" class="pw-toggle" id="pwToggle" aria-label="Tampilkan password">
              <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
                   fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" class="hidden">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-6.5 0-10-8-10-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c6.5 0 10 8 10 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <path d="M1 1l22 22"/>
              </svg>
            </button>
          </div>
          <span class="field-error" id="err-pass"></span>
        </div>
        <button type="submit" class="btn-submit" id="btnSubmit">
          <span id="btnSubmitText">DAFTAR / MASUK</span>
        </button>
      </form>

      <p class="auth-note">
        Sudah punya akun? <a href="#" id="linkLogin">Masuk di sini</a>
      </p>
    </section>

    <section id="screen-dashboard" class="screen hidden" aria-label="Dashboard">
      <div class="dash-card">
        <div class="dash-avatar" id="dashAvatar">?</div>
        <span class="dash-badge" id="dashRole">USER</span>
        <h1 class="dash-title" id="dashName">Halo!</h1>
        <p class="dash-meta" id="dashEmail">—</p>
        <p style="font-size:0.72rem;color:var(--color-text-muted);line-height:1.6;margin-top:4px">
          Dashboard placeholder.<br>Menu lengkap menyusul.
        </p>
        <button type="button" class="btn-logout" id="btnLogout" style="margin-top:var(--space-sm)">LOGOUT</button>
      </div>
    </section>

  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- Supabase SDK (defer biar gak block) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <script>
    /* ============================================================
       🔧 KONFIGURASI SUPABASE — GANTI DENGAN PUNYA LO
       ============================================================ */
    const SUPABASE_URL      = 'https://XXXXXXXXXXXX.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOi...GANTI_INI...';

    const isConfigured = !SUPABASE_URL.includes('XXXX') && !SUPABASE_ANON_KEY.includes('GANTI_INI');
    let supabase = null;

    /* ============================================================
       THEME
       ============================================================ */
    (function themeModule() {
      const root = document.documentElement;
      const btn = document.getElementById('themeToggle');
      const sun = document.getElementById('iconSun');
      const moon = document.getElementById('iconMoon');
      const meta = document.querySelector('meta[name="theme-color"]');
      const KEY = 'dx_theme';

      function applyTheme(theme) {
        root.setAttribute('data-theme', theme);
        const isDark = theme === 'dark';
        sun.classList.toggle('hidden', isDark);
        moon.classList.toggle('hidden', !isDark);
        btn.setAttribute('aria-label', isDark ? 'Ganti ke tema terang' : 'Ganti ke tema gelap');
        if (meta) meta.setAttribute('content', isDark ? '#15130F' : '#FFF8E7');
      }

      const saved = localStorage.getItem(KEY);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(saved || (prefersDark ? 'dark' : 'light'));

      btn.addEventListener('click', () => {
        const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        applyTheme(next);
        localStorage.setItem(KEY, next);
      });
    })();

    /* ============================================================
       TOAST
       ============================================================ */
    let toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = 'toast ' + type, 3000);
    }

    /* ============================================================
       SCREEN MANAGER
       ============================================================ */
    const ScreenManager = (function () {
      const screens = {
        initialized: document.getElementById('screen-initialized'),
        landing:     document.getElementById('screen-landing'),
        dashboard:   document.getElementById('screen-dashboard')
      };
      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      function show(name) {
        Object.entries(screens).forEach(([k, el]) => {
          if (k === name) {
            el.classList.remove('hidden');
            if (k === 'landing') {
              el.classList.add('is-entering');
              requestAnimationFrame(() => el.classList.remove('is-entering'));
            }
          } else {
            el.classList.add('hidden');
          }
        });
      }

      function leaveInitialized(callback) {
        const el = screens.initialized;
        if (prefersReduced) { callback(); return; }
        el.classList.add('is-leaving');
        setTimeout(() => {
          el.classList.remove('is-leaving');
          callback();
        }, 500);
      }

      return { show, leaveInitialized, screens };
    })();

    /* ============================================================
       SCREEN 1 — LOADING 0% → 100% (JALAN DULU, GAK NUNGGU SUPABASE)
       ============================================================ */
    (function initScreen() {
      const fill     = document.getElementById('progressFill');
      const percent  = document.getElementById('progressPercent');
      const bar      = document.getElementById('progressBar');
      const statusEl = document.getElementById('initStatus');

      const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

      const stages = [
        { at: 15,  text: 'Menghubungkan ke server…' },
        { at: 40,  text: 'Memuat modul inti…' },
        { at: 65,  text: 'Menyiapkan sesi…' },
        { at: 85,  text: 'Hampir selesai…' },
        { at: 100, text: 'Server siap.' }
      ];

      let current = 0;

      function setProgress(val) {
        current = Math.min(100, Math.max(0, val));
        fill.style.width = current + '%';
        percent.textContent = current + '%';
        bar.setAttribute('aria-valuenow', current);
        const stage = stages.find(s => current <= s.at) || stages[stages.length - 1];
        statusEl.textContent = stage.text;
      }

      function finish() {
        ScreenManager.leaveInitialized(() => {
          // Coba init Supabase setelah loading selesai
          tryInitSupabase().then(() => {
            checkSessionAndRoute();
          });
        });
      }

      function tick() {
        const step = 2 + Math.random() * 5;
        setProgress(current + step);
        if (current >= 100) {
          setProgress(100);
          setTimeout(finish, prefersReduced ? 200 : 700);
          return;
        }
        const delay = current < 70 ? 90 : 140;
        setTimeout(tick, prefersReduced ? 20 : delay);
      }

      // Mulai loading setelah DOM ready (gak nunggu window.load / font)
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          setProgress(0);
          setTimeout(tick, prefersReduced ? 50 : 300);
        });
      } else {
        setProgress(0);
        setTimeout(tick, prefersReduced ? 50 : 300);
      }
    })();

    /* ============================================================
       INIT SUPABASE — tunggu SDK ready, guard kalau gagal
       ============================================================ */
    function tryInitSupabase() {
      return new Promise((resolve) => {
        // Kalau config belum diisi
        if (!isConfigured) {
          console.warn('[DeruXeon] Supabase belum dikonfigurasi. Daftar/login tidak akan jalan.');
          resolve(false);
          return;
        }

        // Kalau SDK udah ready
        if (window.supabase && window.supabase.createClient) {
          try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            console.log('[DeruXeon] Supabase initialized.');
            resolve(true);
          } catch (e) {
            console.error('[DeruXeon] Supabase init error:', e);
            toast('Gagal init Supabase: ' + e.message, 'error');
            resolve(false);
          }
          return;
        }

        // Kalau belum ready, tunggu max 8 detik
        let tries = 0;
        const maxTries = 80; // 80 x 100ms = 8 detik
        const interval = setInterval(() => {
          tries++;
          if (window.supabase && window.supabase.createClient) {
            clearInterval(interval);
            try {
              supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
              console.log('[DeruXeon] Supabase initialized (delayed).');
              resolve(true);
            } catch (e) {
              console.error('[DeruXeon] Supabase init error:', e);
              resolve(false);
            }
          } else if (tries >= maxTries) {
            clearInterval(interval);
            console.error('[DeruXeon] Supabase SDK gagal load (timeout).');
            toast('Koneksi ke Supabase gagal. Cek internet / CDN.', 'error');
            resolve(false);
          }
        }, 100);
      });
    }

    /* ============================================================
       CEK SESSION → ROUTING
       ============================================================ */
    async function checkSessionAndRoute() {
      // Kalau Supabase gak ready, langsung landing
      if (!supabase) {
        ScreenManager.show('landing');
        return;
      }
      try {
        const { data: { session }, error } = await supabase.auth.getSession();
        if (error) {
          console.warn('[DeruXeon] getSession error:', error);
          ScreenManager.show('landing');
          return;
        }
        if (session) {
          await showDashboard(session.user);
        } else {
          ScreenManager.show('landing');
        }
      } catch (err) {
        console.error('[DeruXeon] Session check error:', err);
        ScreenManager.show('landing');
      }
    }

    /* ============================================================
       DASHBOARD
       ============================================================ */
    async function showDashboard(user) {
      let profile = null;
      if (supabase) {
        try {
          const { data, error } = await supabase
            .from('profiles')
            .select('nickname, wa, telegram, role')
            .eq('id', user.id)
            .maybeSingle();
          if (!error) profile = data;
        } catch (e) {
          console.warn('[DeruXeon] Profile fetch error:', e);
        }
      }

      const nickname = profile?.nickname || user.user_metadata?.nickname || user.email.split('@')[0];
      const role = profile?.role || 'user';

      document.getElementById('dashAvatar').textContent = nickname.charAt(0).toUpperCase();
      document.getElementById('dashName').textContent = `Halo, ${nickname}!`;
      document.getElementById('dashEmail').textContent = user.email;
      document.getElementById('dashRole').textContent = role.toUpperCase();

      ScreenManager.show('dashboard');
    }

    /* ============================================================
       VALIDASI
       ============================================================ */
    const validators = {
      email(v) {
        if (!v) return 'Email wajib diisi.';
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return 'Format email tidak valid.';
        if (v.length > 120) return 'Email terlalu panjang.';
        return '';
      },
      nick(v) {
        if (!v) return 'Nickname wajib diisi.';
        if (v.length < 3) return 'Nickname minimal 3 karakter.';
        if (v.length > 24) return 'Nickname maksimal 24 karakter.';
        if (!/^[a-zA-Z0-9._-]+$/.test(v)) return 'Hanya huruf, angka, titik, underscore, strip.';
        return '';
      },
      wa(v) {
        if (!v) return 'Nomor WhatsApp wajib diisi.';
        const digits = v.replace(/\D/g, '');
        if (!/^08\d{8,12}$/.test(digits)) return 'Nomor WA tidak valid (contoh: 08xxxxxxxxxx).';
        return '';
      },
      tg(v) {
        if (!v) return 'Telegram wajib diisi.';
        const m = v.match(/^(?:https?:\/\/)?(?:t\.me|telegram\.me)\/([a-zA-Z0-9_]{4,32})\/?$/)
              || v.match(/^@([a-zA-Z0-9_]{4,32})$/)
              || v.match(/^([a-zA-Z0-9_]{4,32})$/);
        if (!m) return 'Format: t.me/username (4–32 huruf/angka/_).';
        return '';
      },
      pass(v) {
        if (!v) return 'Password wajib diisi.';
        if (v.length < 6) return 'Password minimal 6 karakter.';
        if (v.length > 64) return 'Password maksimal 64 karakter.';
        return '';
      }
    };

    const fieldMap = {
      email: { input: 'fEmail', field: 'field-email', err: 'err-email' },
      nick:  { input: 'fNick',  field: 'field-nick',  err: 'err-nick'  },
      wa:    { input: 'fWa',    field: 'field-wa',    err: 'err-wa'    },
      tg:    { input: 'fTg',    field: 'field-tg',    err: 'err-tg'    },
      pass:  { input: 'fPass',  field: 'field-pass',  err: 'err-pass'  }
    };

    function setFieldError(key, msg) {
      const m = fieldMap[key];
      if (!m) return;
      const field = document.getElementById(m.field);
      const err = document.getElementById(m.err);
      if (msg) {
        field.classList.add('has-error');
        err.textContent = msg;
        err.style.display = 'block';
      } else {
        field.classList.remove('has-error');
        err.textContent = '';
        err.style.display = 'none';
      }
    }

    function validateField(key, value) {
      const msg = validators[key](value);
      setFieldError(key, msg);
      return !msg;
    }

    function validateAll(form) {
      const data = {
        email: form.email.value.trim(),
        nick:  form.nickname.value.trim(),
        wa:    form.wa.value.trim(),
        tg:    form.telegram.value.trim(),
        pass:  form.password.value
      };
      let ok = true;
      ['email','nick','wa','tg','pass'].forEach(k => {
        if (!validateField(k, data[k])) ok = false;
      });
      return { ok, data };
    }

    /* ============================================================
       PASSWORD TOGGLE
       ============================================================ */
    (function pwModule() {
      const btn = document.getElementById('pwToggle');
      const input = document.getElementById('fPass');
      const open = document.getElementById('eyeOpen');
      const close = document.getElementById('eyeClosed');

      btn.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        open.classList.toggle('hidden', show);
        close.classList.toggle('hidden', !show);
        btn.setAttribute('aria-label', show ? 'Sembunyikan password' : 'Tampilkan password');
      });
    })();

    /* ============================================================
       LOGIC DAFTAR
       ============================================================ */
    (function registerModule() {
      const form = document.getElementById('authForm');
      const btnSubmit = document.getElementById('btnSubmit');
      const btnText = document.getElementById('btnSubmitText');

      Object.keys(fieldMap).forEach(key => {
        const input = document.getElementById(fieldMap[key].input);
        input.addEventListener('input', () => {
          if (input.closest('.field').classList.contains('has-error')) {
            validateField(key, key === 'pass' ? input.value : input.value.trim());
          }
        });
        input.addEventListener('blur', () => {
          const raw = key === 'pass' ? input.value : input.value.trim();
          if (raw) validateField(key, raw);
        });
      });

      const waInput = document.getElementById('fWa');
      waInput.addEventListener('input', () => {
        waInput.value = waInput.value.replace(/[^\d+\s-]/g, '');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (btnSubmit.disabled) return;

        const { ok, data } = validateAll(form);
        if (!ok) {
          toast('Periksa kembali field yang ditandai.', 'error');
          const firstErr = document.querySelector('.field.has-error input');
          if (firstErr) firstErr.focus();
          return;
        }

        // Cek supabase ready
        if (!supabase) {
          toast('Supabase belum siap. Cek konfigurasi / internet.', 'error');
          return;
        }

        btnSubmit.disabled = true;
        btnText.textContent = 'MEMPROSES…';
        const spinner = document.createElementNS('http://www.w3.org/2000/svg','svg');
        spinner.setAttribute('class','spinner');
        spinner.setAttribute('viewBox','0 0 24 24');
        spinner.innerHTML = '<circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="3" stroke-opacity="0.25"/><path d="M12 2a10 10 0 0 1 10 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>';
        btnSubmit.prepend(spinner);

        try {
          const { data: authData, error } = await supabase.auth.signUp({
            email: data.email,
            password: data.pass,
            options: {
              data: { nickname: data.nick, wa: data.wa, telegram: data.tg }
            }
          });

          if (error) {
            const msg = error.message.toLowerCase();
            if (msg.includes('already registered') || msg.includes('already been registered') || msg.includes('user already')) {
              setFieldError('email', 'Email sudah terdaftar.');
              toast('Email sudah terdaftar. Coba masuk.', 'error');
            } else if (msg.includes('password')) {
              setFieldError('pass', 'Password tidak memenuhi syarat.');
              toast('Password terlalu lemah.', 'error');
            } else if (msg.includes('rate limit')) {
              toast('Terlalu banyak percobaan. Tunggu sebentar.', 'error');
            } else {
              toast('Gagal daftar: ' + error.message, 'error');
            }
            return;
          }

          if (authData.session) {
            toast('Pendaftaran berhasil!', 'success');
            setTimeout(() => showDashboard(authData.user), 900);
          } else {
            toast('Cek email kamu untuk verifikasi, lalu masuk.', 'success');
            setTimeout(() => form.reset(), 1500);
          }
        } catch (err) {
          console.error('[DeruXeon] SignUp error:', err);
          toast('Error: ' + (err.message || 'jaringan bermasalah'), 'error');
        } finally {
          spinner.remove();
          btnSubmit.disabled = false;
          btnText.textContent = 'DAFTAR / MASUK';
        }
      });

      document.getElementById('btnGoogle').addEventListener('click', async () => {
        if (!supabase) { toast('Supabase belum siap.', 'error'); return; }
        try {
          const { error } = await supabase.auth.signInWithOAuth({
            provider: 'google',
            options: { redirectTo: window.location.href.split('#')[0] }
          });
          if (error) toast('Google login gagal: ' + error.message, 'error');
        } catch (err) {
          toast('Google OAuth error.', 'error');
        }
      });

      document.getElementById('linkLogin').addEventListener('click', (e) => {
        e.preventDefault();
        toast('Fitur login terpisah belum tersedia. Isi form untuk daftar.', '');
      });
    })();

    /* ============================================================
       LOGOUT
       ============================================================ */
    document.getElementById('btnLogout').addEventListener('click', async () => {
      if (!supabase) { ScreenManager.show('landing'); return; }
      const { error } = await supabase.auth.signOut();
      if (error) { toast('Logout gagal: ' + error.message, 'error'); return; }
      toast('Berhasil logout.', 'success');
      setTimeout(() => {
        document.getElementById('authForm').reset();
        ScreenManager.show('landing');
      }, 600);
    });

    /* ============================================================
       AUTH LISTENER (OAuth redirect, session change)
       ============================================================ */
    // Didaftarkan nanti setelah supabase init, biar gak error
    function attachAuthListener() {
      if (!supabase) return;
      supabase.auth.onAuthStateChange((event, session) => {
        console.log('[DeruXeon] Auth event:', event);
        if (event === 'SIGNED_IN' && session) {
          showDashboard(session.user);
        }
        if (event === 'SIGNED_OUT') {
          ScreenManager.show('landing');
        }
      });
    }

    // Hook: setelah supabase init sukses, pasang listener
    const _origTryInit = tryInitSupabase;
    tryInitSupabase = function() {
      return _origTryInit().then(ok => {
        if (ok) attachAuthListener();
        return ok;
      });
    };
  </script>
</body>
</html>
