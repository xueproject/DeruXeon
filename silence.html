<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0A0F">
  <title>DeruXeon — Silence Mode</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       TOKENS (Silence Theme)
       ============================================================ */
    :root {
      --pop-yellow: #FFD93D;
      --pop-pink:   #FF6B9D;
      --pop-blue:   #4ECDC4;
      --pop-red:    #FF5252;
      --pop-purple: #A78BFA;
      --pop-green:  #86EFAC;

      --silence-bg:     #0A0A0F;
      --silence-card:   #14121F;
      --silence-card2:  #1C1829;
      --silence-accent: #7C3AED;
      --silence-glow:   #A78BFA;
      --silence-text:   #E5E7EB;
      --silence-muted:  #8B8B9E;

      --space-xs: 0.5rem; --space-sm: 1rem; --space-md: 1.5rem;
      --font-display: 'Bangers', 'Impact', cursive; 
      --font-body: 'Nunito', system-ui, -apple-system, sans-serif;
      --app-max-width: 430px; --app-pad: 1.25rem;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-body); font-weight: 600; font-size: 16px; line-height: 1.6;
      color: var(--silence-text); background-color: var(--silence-bg);
      background-image: radial-gradient(circle at 20% 10%, rgba(124,58,237,0.15), transparent 40%), radial-gradient(circle at 80% 90%, rgba(167,139,250,0.12), transparent 40%), radial-gradient(circle at 1px 1px, rgba(167,139,250,0.06) 1px, transparent 0);
      background-size: auto, auto, 12px 12px; -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; justify-content: center;
    }

    h1, h2, h3, h4, h5, h6 { font-family: var(--font-display); font-weight: 400; line-height: 1; color: #F2EDE0; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, select { font-family: inherit; font-size: inherit; color: inherit; outline: none; }
    .hidden { display: none !important; }

    /* ============================================================
       SCREEN MANAGER
       ============================================================ */
    .screen { display: none; flex-direction: column; width: 100%; max-width: var(--app-max-width); min-height: 100dvh; padding: var(--space-md) var(--app-pad); margin: 0 auto; animation: fadeIn 0.4s ease; }
    .screen.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* ============================================================
       1. GATE SCREEN
       ============================================================ */
    #gateScreen { align-items: center; justify-content: center; text-align: center; gap: var(--space-md); }
    .gate-lock { width: 100px; height: 100px; border-radius: 24px; background: linear-gradient(135deg, var(--silence-accent), #4C1D95); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(124,58,237,0.6); animation: pulse-glow 2.5s infinite; margin-bottom: 8px; }
    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 40px rgba(124,58,237,0.6); } 50% { box-shadow: 0 0 60px rgba(167,139,250,0.9); } }
    .gate-lock svg { width: 48px; height: 48px; color: #F2EDE0; }
    .gate-title { font-size: 2.4rem; text-shadow: 0 0 30px rgba(167,139,250,0.7); }
    .gate-sub { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; color: var(--silence-muted); }
    
    .gate-form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 12px; margin-top: var(--space-md); }
    .gate-field label { display: block; font-size: 0.68rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--silence-muted); margin-bottom: 6px; text-align: left; }
    .gate-field input { width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid rgba(167,139,250,0.3); background: var(--silence-card2); color: var(--silence-text); font-size: 0.9rem; font-weight: 700; text-align: center; letter-spacing: 0.1em; transition: 0.2s; }
    .gate-field input:focus { border-color: var(--silence-glow); box-shadow: 0 0 0 3px rgba(167,139,250,0.2); }
    .gate-field.has-error input { border-color: var(--pop-red); box-shadow: 0 0 0 3px rgba(255,82,82,0.2); }
    .gate-error { display: none; font-size: 0.72rem; font-weight: 700; color: var(--pop-red); margin-top: -4px; }
    .gate-error.show { display: block; }

    .gate-btn { width: 100%; padding: 15px; border-radius: 12px; background: linear-gradient(135deg, var(--silence-accent), #4C1D95); border: 2px solid var(--silence-glow); color: #F2EDE0; font-family: var(--font-display); font-size: 1.3rem; box-shadow: 0 6px 0 rgba(76,29,149,0.6); transition: 0.15s; margin-top: 6px; }
    .gate-btn:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(76,29,149,0.6); }
    .gate-btn:disabled { opacity: 0.6; transform: none; }
    
    .gate-back { margin-top: var(--space-sm); font-size: 0.75rem; font-weight: 800; color: var(--silence-muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .gate-back:hover { color: var(--silence-glow); }
    .gate-back svg { width: 16px; height: 16px; }

    /* ============================================================
       2. LOADING SCREEN
       ============================================================ */
    #loadingScreen { align-items: center; justify-content: center; text-align: center; gap: var(--space-md); }
    .load-logo { width: 90px; height: 90px; border-radius: 22px; background: linear-gradient(135deg, var(--silence-accent), #4C1D95); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 40px rgba(124,58,237,0.6); }
    .load-logo svg { width: 44px; height: 44px; color: #F2EDE0; }
    .load-title { font-size: 2rem; text-shadow: 0 0 20px rgba(167,139,250,0.6); }
    
    .load-progress-wrap { width: 100%; max-width: 280px; margin-top: 8px; }
    .load-progress-track { width: 100%; height: 12px; border-radius: 6px; background: var(--silence-card2); border: 1px solid rgba(167,139,250,0.3); overflow: hidden; }
    .load-progress-fill { width: 0%; height: 100%; background: linear-gradient(90deg, var(--silence-accent), var(--silence-glow)); transition: width 0.2s; box-shadow: 0 0 10px rgba(167,139,250,0.8); }
    .load-percent { font-family: var(--font-display); font-size: 1.1rem; color: var(--silence-glow); margin-top: 10px; }
    .load-status { font-size: 0.7rem; color: var(--silence-muted); margin-top: 6px; font-weight: 700; }

    /* ============================================================
       3. DASHBOARD SILENCE
       ============================================================ */
    #dashboardScreen { gap: var(--space-md); }

    /* BANNER */
    .bypass-banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: linear-gradient(135deg, #7C3AED, #4C1D95); border-radius: 12px; border: 2px solid var(--silence-glow); box-shadow: 0 0 25px rgba(124,58,237,0.5); position: relative; overflow: hidden; }
    .bypass-banner::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, #fff, transparent); animation: scan 2.5s linear infinite; opacity: 0.6; }
    @keyframes scan { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
    .banner-icon { width: 32px; height: 32px; color: var(--pop-yellow); }
    .banner-text { flex: 1; }
    .banner-title { font-family: var(--font-display); font-size: 1rem; color: #F2EDE0; }
    .banner-sub { font-size: 0.6rem; font-weight: 800; color: rgba(242,237,224,0.7); margin-top: 3px; }
    .banner-pulse { width: 10px; height: 10px; border-radius: 50%; background: var(--pop-green); box-shadow: 0 0 12px var(--pop-green); animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* TOPBAR */
    .topbar { display: flex; align-items: center; justify-content: space-between; }
    .topbar-title { font-size: 1.4rem; display: flex; align-items: center; gap: 8px; }
    .topbar-title svg { width: 20px; height: 20px; color: var(--silence-glow); }
    .exit-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--silence-card2); border: 2px solid var(--pop-red); color: var(--pop-red); display: flex; align-items: center; justify-content: center; }
    .exit-btn:active { transform: scale(0.92); }
    .exit-btn svg { width: 20px; height: 20px; }

    /* WELCOME */
    .welcome-card { padding: var(--space-md); background: linear-gradient(135deg, var(--silence-card2), var(--silence-card)); border: 2px solid var(--silence-glow); border-radius: 16px; box-shadow: 0 0 20px rgba(124,58,237,0.2); }
    .welcome-title { font-size: 1.3rem; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .welcome-title b { color: var(--silence-glow); }
    .welcome-sub { font-size: 0.72rem; color: var(--silence-muted); margin-top: 4px; }
    .welcome-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
    .s-badge { font-size: 0.55rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; background: rgba(124,58,237,0.2); color: var(--silence-glow); border: 1px solid rgba(167,139,250,0.4); }

    /* INFO GRID */
    .s-info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .s-info { padding: 12px 14px; background: var(--silence-card); border: 1px solid rgba(167,139,250,0.2); border-radius: 12px; }
    .s-info-label { font-size: 0.55rem; font-weight: 800; color: var(--silence-muted); margin-bottom: 4px; }
    .s-info-value { font-family: var(--font-display); font-size: 1.1rem; color: var(--silence-glow); }
    .s-info-value small { font-size: 0.7rem; }

    /* SECTIONS */
    .s-section { background: var(--silence-card); border: 1px solid rgba(167,139,250,0.2); border-radius: 14px; overflow: hidden; }
    .s-section-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--silence-card2); border-bottom: 1px solid rgba(167,139,250,0.15); }
    .s-section-head h2 { font-size: 1.05rem; }
    .s-section-head svg { width: 18px; height: 18px; color: var(--silence-glow); }
    .s-section-body { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    
    .blocked { color: var(--pop-red) !important; font-weight: 800; font-size: 0.7rem; text-transform: uppercase; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 20px 0; }
    .blocked svg { width: 16px; height: 16px; }

    /* FORMS */
    .s-field label { display: block; font-size: 0.62rem; font-weight: 800; color: var(--silence-muted); margin-bottom: 5px; text-transform: uppercase; }
    .s-field input, .s-field select { width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid rgba(167,139,250,0.25); background: var(--silence-card2); color: var(--silence-text); font-weight: 600; }
    .s-field input:focus, .s-field select:focus { border-color: var(--silence-glow); }
    .s-field select option { background: var(--silence-card2); color: var(--silence-text); }
    .s-row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    /* BUTTONS */
    .s-btn { width: 100%; padding: 12px; border-radius: 10px; background: linear-gradient(135deg, var(--silence-accent), #4C1D95); border: 1px solid var(--silence-glow); color: #F2EDE0; font-family: var(--font-display); font-size: 1.05rem; letter-spacing: 0.06em; box-shadow: 0 3px 0 rgba(76,29,149,0.6); transition: 0.1s; }
    .s-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgba(76,29,149,0.6); }
    .s-btn:disabled { opacity: 0.6; transform: none; }
    .s-btn.small { font-size: 0.85rem; padding: 9px; }

    /* GAME LOG */
    .game-log { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; margin-top: 10px; }
    .log-item { padding: 8px 12px; background: var(--silence-card2); border-left: 3px solid var(--silence-glow); border-radius: 4px; font-size: 0.75rem; }
    .log-item .log-time { font-size: 0.6rem; color: var(--silence-muted); margin-top: 2px; }
    .log-empty { text-align: center; font-size: 0.7rem; color: var(--silence-muted); padding: 10px; }

    /* VERIFY RESULT */
    .verify-result { padding: 12px; background: var(--silence-card2); border: 1px solid rgba(167,139,250,0.3); border-radius: 10px; font-size: 0.78rem; line-height: 1.8; }
    .verify-result b { color: var(--silence-glow); }

    /* TOAST */
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--silence-card2); color: var(--silence-text); padding: 12px 18px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; border: 1px solid var(--silence-glow); box-shadow: 0 0 30px rgba(124,58,237,0.5); opacity: 0; pointer-events: none; transition: 0.25s; z-index: 300; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { border-color: var(--pop-red); color: #FCA5A5; }
    .toast.success { border-color: var(--pop-green); color: var(--pop-green); }
  </style>
</head>

  <div class="screen" id="loadingScreen">

  <!-- 3. DASHBOARD SILENCE -->
  <div class="screen" id="dashboardScreen">

      <div class="banner-text">
        <div class="banner-title">BYPASS ACTIVE</div>
        <div class="banner-sub">Silence Mode · Private Access</div>
      </div>
      <div class="banner-pulse"></div>
    </div>

    <header class="topbar">
      <h1 class="topbar-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> SILENCE
      </h1>
      <button class="exit-btn" id="btnExit"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg></button>
    </header>

    <div class="welcome-card">
      <div class="welcome-title" id="welcomeTitle">Memuat…</div>
      <div class="welcome-sub" id="welcomeSub">...</div>
      <div class="welcome-badges">
        <span class="s-badge" id="badgeRole">USER</span>
        <span class="s-badge">BYPASS</span>
      </div>
    </div>

    <div class="s-info-grid">
      <div class="s-info">
        <div class="s-info-label">Last Day</div>
        <div class="s-info-value" id="infoLastDay">0<small>d</small></div>
      </div>
      <div class="s-info">
        <div class="s-info-label">Murid</div>

        <button class="s-btn small" id="btnVerify">SEARCH</button>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script>
    /* ============================================================
       KONFIGURASI & STATE
       ============================================================ */
    const SUPABASE_URL      = 'https://lxdjnzsbunkkwjkltabt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_W9AFHz0Z3M0YhpVRgLsbbQ_L8iUd-q1';
    const STORAGE_KEY       = 'dx_silence_unlocked';

    let supaClient = null;
    let currentUser = null;
    let userRole = 'user';
    let isOwner = false;
    let gameMode = 'private';

    /* ============================================================
       HELPERS
       ============================================================ */
    let toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.className = 'toast show ' + type;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.className = 'toast ' + type, 3000);
    }
    
    function showScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }

    async function connectSupabase() {
      return new Promise((resolve) => {
        if (window.supabase && window.supabase.createClient) {
          supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          resolve(true); return;
        }
        let tries = 0;
        const timer = setInterval(() => {
          tries++;
          if (window.supabase && window.supabase.createClient) {
            clearInterval(timer); supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); resolve(true);
          }
          if (tries >= 80) { clearInterval(timer); resolve(false); }
        }, 100);
      });
    }

    /* ============================================================
       GATE LOGIC (PASSWORD + BYPASS)
       ============================================================ */
    (function gateModule() {
      const form = document.getElementById('gateForm');
      const passInput = document.getElementById('gatePass');
      const byPassInp = document.getElementById('gateBypass');
      const fieldPass = document.getElementById('fieldPass');
      const fieldByp  = document.getElementById('fieldBypass');
      const gateError = document.getElementById('gateError');
      const gateBtn   = document.getElementById('gateBtn');
      const gateBtnTxt= document.getElementById('gateBtnText');

      // Kalau udah unlock di sesi ini, langsung ke loading
      if (sessionStorage.getItem(STORAGE_KEY) === '1') {
        showScreen('loadingScreen');
        runLoadingSequence();
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const pass = passInput.value.trim();
        const bypass = byPassInp.value.trim();

        fieldPass.classList.remove('has-error');
        fieldByp.classList.remove('has-error');
        gateError.classList.remove('show');

        if (!pass || !bypass) {
          if (!pass) fieldPass.classList.add('has-error');
          if (!bypass) fieldByp.classList.add('has-error');
          gateError.textContent = 'Wajib isi keduanya.';
          gateError.classList.add('show'); return;
        }

        gateBtn.disabled = true; gateBtnTxt.textContent = 'VERIFYING…';

        const ok = await connectSupabase();
        if (!ok) {
          toast('Koneksi server gagal', 'error');
          gateBtn.disabled = false; gateBtnTxt.textContent = 'UNLOCK'; return;
        }

        // Cek ke RPC Supabase (Bukan hardcode JS)
        const { data: isValid, error } = await supaClient.rpc('check_silence_access', { p_pass: pass, p_bypass: bypass });

        if (isValid) {
          sessionStorage.setItem(STORAGE_KEY, '1');
          showScreen('loadingScreen');
          runLoadingSequence();
        } else {
          if (error) console.error(error);
          fieldPass.classList.add('has-error');
          fieldByp.classList.add('has-error');
          gateError.textContent = 'Password / Bypass salah.';
          gateError.classList.add('show');
          toast('Access denied', 'error');
          gateBtn.disabled = false; gateBtnTxt.textContent = 'UNLOCK';
        }
      });
    })();

    /* ============================================================
       LOADING SEQUENCE & INIT DATA
       ============================================================ */
    async function runLoadingSequence() {
      const fill = document.getElementById('loadFill');
      const percent = document.getElementById('loadPercent');
      const status = document.getElementById('loadStatus');

      let current = 0;
      function setProgress(val, text) {
        current = val; fill.style.width = current + '%'; percent.textContent = Math.floor(current) + '%';
        if (text) status.textContent = text;
      }

      setProgress(20, 'Menghubungkan ke server…');
      if (!supaClient) {
        const ok = await connectSupabase();
        if (!ok) { status.textContent = 'Gagal konek ke server.'; status.style.color = 'var(--pop-red)'; return; }
      }

      setProgress(40, 'Memeriksa sesi login…');
      const { data: { session } } = await supaClient.auth.getSession();
      
      if (!session) {
        status.textContent = 'Sesi tidak ditemukan. Redirect…';
        setTimeout(() => window.location.href = 'login.html', 1500); return;
      }
      currentUser = session.user;

      setProgress(60, 'Memuat profil user…');
      const { data: profile } = await supaClient.from('profiles').select('nickname, role').eq('id', currentUser.id).maybeSingle();
      userRole = profile?.role || 'user';
      isOwner = userRole === 'owner';

      setProgress(80, 'Menghitung murid…');
      const { count } = await supaClient.from('verified_murid').select('*', { count: 'exact', head: true });

      setProgress(100, 'Bypass siap.');
      setTimeout(() => {
        showScreen('dashboardScreen');
        initDashboard(profile?.nickname || 'User', count || 0);
      }, 500);
    }

    /* ============================================================
       DASHBOARD INIT
       ============================================================ */
    function initDashboard(nickname, muridCount) {
      document.getElementById('welcomeTitle').innerHTML = `Welcome, <b>${nickname}</b>`;
      document.getElementById('welcomeSub').textContent = `@${(currentUser.email || '').split('@')[0]} · Private Mode`;
      document.getElementById('badgeRole').textContent = userRole.toUpperCase();
      document.getElementById('infoLastDay').innerHTML = isOwner ? `999<small>d</small>` : `0<small>d</small>`;
      document.getElementById('infoMurid').textContent = muridCount;

      if (isOwner) document.getElementById('sectionVerify').classList.remove('hidden');

      wireGame();
      wireVerify();
      loadGameHistory();
    }

    /* ============================================================
       GAME TOOLS LOGIC
       ============================================================ */
    function wireGame() {
      const target = document.getElementById('gameTarget');
      const menu = document.getElementById('gameMenu');
      const sender = document.getElementById('gameSender');
      const btnExec = document.getElementById('btnExecute');
      const btnPriv = document.getElementById('btnPrivate');
      const btnGlob = document.getElementById('btnGlobal');
      
      btnPriv.addEventListener('click', () => { gameMode = 'private'; toast('Mode: Private'); });
      btnGlob.addEventListener('click', () => {
        if (!isOwner) return toast('Global hanya untuk owner', 'error');
        gameMode = 'global'; toast('Mode: Global');
      });

      target.addEventListener('input', () => { target.value = target.value.replace(/[^\d]/g, ''); });

      btnExec.addEventListener('click', async () => {
        const tgt = target.value.trim();
        const mnu = menu.value;
        const snd = sender.value;

        if (!tgt || !mnu || !snd) return toast('Lengkapi semua field', 'error');

        btnExec.disabled = true; btnExec.textContent = 'EXECUTING…';

        const { error } = await supaClient.from('game_requests').insert({
          user_id: currentUser.id, target: tgt, menu: mnu, sender: snd, mode: gameMode
        });

        btnExec.disabled = false; btnExec.textContent = 'EXECUTE';

        if (error) {
          console.error(error);
          return toast('Gagal execute: ' + error.message, 'error');
        }

        toast('Game executed!', 'success');
        loadGameHistory();
      });
    }

    async function loadGameHistory() {
      const log = document.getElementById('gameLog');
      log.innerHTML = '<div class="log-empty">Memuat history...</div>';

      const { data, error } = await supaClient.from('game_requests').select('*').eq('user_id', currentUser.id).order('created_at', { ascending: false }).limit(10);

      if (error || !data || data.length === 0) {
        log.innerHTML = '<div class="log-empty">Belum ada history.</div>'; return;
      }

      log.innerHTML = data.map(item => {
        const date = new Date(item.created_at).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
        return `<div class="log-item"><div><b>${item.menu}</b> → ${item.target} (${item.mode})</div><div class="log-time">${date} · ${item.sender}</div></div>`;
      }).join('');
    }

    /* ============================================================
       VERIFIKASI API LOGIC (OWNER)
       ============================================================ */
    function wireVerify() {
      const input = document.getElementById('verifyApi');
      const btn = document.getElementById('btnVerify');
      const result = document.getElementById('verifyResult');
      if (!btn) return;

      btn.addEventListener('click', async () => {
        const key = input.value.trim();
        if (!key) return toast('Masukkan API key', 'error');

        const pattern = /^DERU_MEMBER_XEON\d{6}-DX-ON$/;
        if (!pattern.test(key)) { toast('Format API tidak valid', 'error'); result.classList.add('hidden'); return; }

        btn.disabled = true; btn.textContent = 'SEARCHING…';

        // Cek apakah udah ada di DB
        const { data: existing } = await supaClient.from('verified_murid').select('id').eq('api_key', key).maybeSingle();

        if (existing) {
          btn.disabled = false; btn.textContent = 'SEARCH';
          result.classList.remove('hidden');
          result.innerHTML = `<div style="color:var(--pop-red)">❌ API sudah terdaftar sebagai Murid.</div>`;
          return;
        }

        btn.disabled = false; btn.textContent = 'SEARCH';
        result.classList.remove('hidden');
        result.innerHTML = `
          <div><b>1 ID Terdeteksi (Valid)</b></div>
          <div>API Key: <b>${key}</b></div>
          <button class="s-btn small" id="btnConfirmVerify" style="margin-top:8px">BENAR — Jadikan Murid Xeon</button>
        `;

        document.getElementById('btnConfirmVerify').addEventListener('click', async () => {
          document.getElementById('btnConfirmVerify').textContent = 'MEMPROSES…';
          
          const { error } = await supaClient.from('verified_murid').insert({ api_key: key, added_by: currentUser.id });
          if (error) {
            toast('Gagal verifikasi: ' + error.message, 'error');
            document.getElementById('btnConfirmVerify').textContent = 'COBA LAGI'; return;
          }

          toast('Sukses! User jadi Murid Xeon', 'success');
          result.innerHTML = `<div style="color:var(--pop-green)">✅ Sukses! User tercatat sebagai Murid Xeon.</div>`;
          
          const { count } = await supaClient.from('verified_murid').select('*', { count: 'exact', head: true });
          document.getElementById('infoMurid').textContent = count || 0;
        });
      });
    }

    /* ============================================================
       EXIT
       ============================================================ */
    document.getElementById('btnExit').addEventListener('click', () => {
      if (!confirm('Keluar dari Mode Silit?')) return;
      sessionStorage.removeItem(STORAGE_KEY);
      window.location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
