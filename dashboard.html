<!DOCTYPE html>
<html lang="id" data-theme="classic">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF8E7">
  <title>DeruXeon — Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    /* THEME ENGINE */
    :root {
      --pop-yellow: #FFD93D; --pop-pink: #FF6B9D; --pop-blue: #4ECDC4; --pop-red: #FF5252; --pop-purple: #A78BFA;
      --space-xs: 0.5rem; --space-sm: 1rem; --space-md: 1.5rem;
      --font-display: 'Bangers', 'Impact', cursive; --font-body: 'Nunito', system-ui, -apple-system, sans-serif;
      --app-max-width: 430px; --app-pad: 1.25rem; --nav-height: 76px;
    }
    [data-theme="classic"] {
      --ink: #1A1A1A; --paper: #FFF8E7; --paper-dark: #F5EBD0; --color-text-muted: #5A5A5A;
      --card-bg: var(--paper); --card-border: 3px solid var(--ink); --shadow-comic: 5px 5px 0 var(--ink); --shadow-comic-sm: 3px 3px 0 var(--ink);
      --halftone: rgba(26,26,26,0.08); --nav-bg: var(--paper);
      --bg-img: radial-gradient(circle at 1px 1px, var(--halftone) 1px, transparent 0); --bg-size: 12px 12px;
    }
    [data-theme="blueglass"] {
      --ink: #E0F2FE; --paper: #0F172A; --paper-dark: #1E293B; --color-text-muted: #94A3B8; --pop-yellow: #60A5FA;
      --card-bg: rgba(30, 41, 59, 0.6); --card-border: 1px solid rgba(96, 165, 250, 0.3); --shadow-comic: 0 8px 32px 0 rgba(0, 0, 0, 0.37); --shadow-comic-sm: 0 4px 12px 0 rgba(0, 0, 0, 0.2);
      --halftone: transparent; --nav-bg: rgba(15, 23, 42, 0.8); --bg-img: radial-gradient(circle at 50% 0%, #1e3a8a 0%, transparent 70%); --bg-size: 100% 100%;
    }
    [data-theme="imyut"] {
      --ink: #FFFFFF; --paper: #1A1A1A; --paper-dark: #2A2A2A; --color-text-muted: #CCCCCC;
      --card-bg: rgba(26, 26, 26, 0.75); --card-border: 2px solid var(--pop-pink); --shadow-comic: 0 8px 20px rgba(0,0,0,0.5); --shadow-comic-sm: 0 4px 10px rgba(0,0,0,0.3);
      --halftone: transparent; --nav-bg: rgba(26, 26, 26, 0.9); --bg-img: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1578632767115-351597cf2477?q=80&w=430&auto=format&fit=crop'); --bg-size: cover;
    }
    [data-theme="comic"] {
      --ink: #111; --paper: #FDF5E6; --paper-dark: #EADDCA; --color-text-muted: #444; --pop-yellow: #FCA311; --pop-pink: #E63946; --pop-blue: #457B9D;
      --card-bg: var(--paper); --card-border: 3px dashed var(--ink); --shadow-comic: 6px 6px 0 var(--ink); --shadow-comic-sm: 4px 4px 0 var(--ink);
      --halftone: rgba(0,0,0,0.15); --nav-bg: var(--paper); --bg-img: radial-gradient(circle at 2px 2px, var(--halftone) 2px, transparent 0); --bg-size: 16px 16px;
    }

    /* BASE */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body); font-weight: 600; font-size: 16px; line-height: 1.6;
      color: var(--ink); background-color: var(--paper); background-image: var(--bg-img); background-size: var(--bg-size);
      -webkit-font-smoothing: antialiased; min-height: 100dvh; display: flex; justify-content: center;
    }
    h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1; color: inherit; }
    a { color: inherit; text-decoration: none; }
    button { font-family: inherit; font-size: inherit; color: inherit; background: none; border: none; cursor: pointer; }
    input, textarea { font-family: inherit; font-size: inherit; color: inherit; outline: none; }
    .hidden { display: none !important; }
    .badge-verified { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; background: var(--pop-blue); border-radius: 50%; margin-left: 4px; color: #fff; }
    .badge-verified svg { width: 8px; height: 8px; stroke-width: 4; }

    /* LAYOUT */
    .app-shell { width: 100%; max-width: var(--app-max-width); min-height: 100dvh; padding-inline: var(--app-pad); padding-top: var(--space-md); padding-bottom: calc(var(--nav-height) + var(--space-md)); display: flex; flex-direction: column; gap: var(--space-md); }
    
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: var(--space-sm); }
    .topbar-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .topbar-avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--pop-blue); border: var(--card-border); box-shadow: var(--shadow-comic-sm); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 1.3rem; color: #111; flex-shrink: 0; }
    .topbar-info { min-width: 0; }
    .topbar-name { font-family: var(--font-display); font-size: 1.1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; }
    .topbar-role { font-size: 0.6rem; font-weight: 800; text-transform: uppercase; color: var(--color-text-muted); margin-top: 2px; }
    .topbar-actions { display: flex; gap: 8px; }
    .icon-btn { width: 38px; height: 38px; border-radius: 10px; background: var(--pop-yellow); border: var(--card-border); box-shadow: var(--shadow-comic-sm); display: flex; align-items: center; justify-content: center; color: #111; transition: transform 0.12s; }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 20px; height: 20px; }

    .main { flex: 1; display: flex; flex-direction: column; gap: var(--space-md); }
    .screen-panel { display: none; flex-direction: column; gap: var(--space-md); animation: fadeIn 0.3s ease; }
    .screen-panel.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    .page-title { font-size: 2rem; text-shadow: 2px 2px 0 var(--pop-yellow); margin-bottom: 4px; }

    /* HOME */
    .greet-card { padding: var(--space-md); background: var(--pop-yellow); border: var(--card-border); border-radius: 18px; box-shadow: var(--shadow-comic); color: #111; }
    .greet-title { font-family: var(--font-display); font-size: 1.6rem; line-height: 1.1; }
    .greet-badge { display: inline-block; margin-top: 10px; font-size: 0.6rem; font-weight: 800; text-transform: uppercase; background: #111; color: var(--pop-yellow); padding: 4px 10px; border-radius: 4px; }
    
    /* STORY SECTION */
    .story-container { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 10px; scrollbar-width: none; }
    .story-container::-webkit-scrollbar { display: none; }
    .story-item { display: flex; flex-direction: column; align-items: center; gap: 6px; flex-shrink: 0; cursor: pointer; }
    .story-circle { width: 65px; height: 65px; border-radius: 50%; background: var(--paper-dark); border: 3px solid var(--pop-pink); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; box-shadow: var(--shadow-comic-sm); transition: transform 0.2s; }
    .story-circle:hover { transform: scale(1.05); }
    .story-circle img { width: 100%; height: 100%; object-fit: cover; }
    .story-circle.add-new { border-color: var(--pop-blue); border-style: dashed; background: var(--pop-blue); color: #fff; font-size: 2rem; font-family: var(--font-display); }
    .story-name { font-size: 0.65rem; font-weight: 800; max-width: 65px; text-overflow: ellipsis; overflow: hidden; white-space: nowrap; text-align: center; }
    
    .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .stat-card { padding: 14px 8px; background: var(--card-bg); border: var(--card-border); border-radius: 12px; box-shadow: var(--shadow-comic-sm); text-align: center; }
    .stat-num { font-family: var(--font-display); font-size: 1.3rem; }
    .stat-lbl { font-size: 0.58rem; font-weight: 800; text-transform: uppercase; color: var(--color-text-muted); }

    /* MENU CARD & SETTINGS */
    .menu-card { background: var(--card-bg); border: var(--card-border); border-radius: 14px; box-shadow: var(--shadow-comic-sm); padding: 16px; display: flex; flex-direction: column; gap: 10px; }
    .menu-card h3 { font-size: 1.2rem; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-bottom: 2px dashed var(--color-text-muted); gap: 10px; }
    .setting-row:last-child { border-bottom: none; padding-bottom: 0; }
    .setting-label { font-size: 0.75rem; font-weight: 800; text-transform: uppercase; }
    .setting-value { font-size: 0.8rem; font-weight: 700; color: var(--color-text-muted); text-align: right; word-break: break-all; max-width: 60%; }
    .menu-btn { padding: 12px 16px; border-radius: 10px; background: var(--pop-yellow); border: var(--card-border); box-shadow: var(--shadow-comic-sm); font-family: var(--font-display); font-size: 1rem; color: #111; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.1s; }
    .menu-btn.danger { background: var(--pop-red); color: #fff; }
    .theme-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .theme-btn { padding: 14px; border-radius: 10px; border: var(--card-border); background: var(--paper-dark); color: var(--ink); font-weight: 800; font-size: 0.8rem; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow-comic-sm); position: relative; }
    .theme-btn.active { border-color: var(--pop-blue); box-shadow: 0 0 0 3px var(--pop-blue); }
    .theme-preview { width: 100%; height: 40px; border-radius: 6px; border: 1px solid var(--color-text-muted); }

    /* SOCIAL (CHAT ONLY) */
    .subtabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; }
    .subtab { flex-shrink: 0; padding: 9px 16px; border-radius: 10px; border: var(--card-border); background: var(--card-bg); color: var(--ink); font-size: 0.7rem; font-weight: 800; text-transform: uppercase; box-shadow: var(--shadow-comic-sm); }
    .subtab.active { background: var(--pop-yellow); transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--ink); color: #111; }

    .chat-view { display: flex; flex-direction: column; height: calc(100dvh - var(--nav-height) - 180px); background: var(--card-bg); border: var(--card-border); border-radius: 14px; overflow: hidden; }
    .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px; background: var(--pop-blue); color: #111; border-bottom: var(--card-border); }
    .chat-back { background: rgba(0,0,0,0.1); width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .chat-messages { flex: 1; overflow-y: auto; padding: 12px; display: flex; flex-direction: column; gap: 8px; background: var(--paper-dark); }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 0.85rem; border: 2px solid var(--ink); }
    .msg.me { align-self: flex-end; background: var(--pop-yellow); color: #111; border-bottom-right-radius: 4px; }
    .msg.them { align-self: flex-start; background: var(--card-bg); color: var(--ink); border-bottom-left-radius: 4px; }
    .msg-sender { font-size: 0.65rem; font-weight: 800; color: var(--pop-pink); margin-bottom: 2px; }
    .msg-time { font-size: 0.6rem; opacity: 0.6; margin-top: 2px; text-align: right; }
    .chat-input { display: flex; gap: 8px; padding: 10px; border-top: var(--card-border); background: var(--card-bg); }
    .chat-input input { flex: 1; padding: 10px; border-radius: 20px; border: var(--card-border); background: var(--paper-dark); color: var(--ink); }
    .chat-send { width: 40px; height: 40px; border-radius: 50%; background: var(--pop-yellow); border: var(--card-border); color: #111; display: flex; align-items: center; justify-content: center; }

    .user-list { display: flex; flex-direction: column; gap: 8px; }
    .user-row { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card-bg); border: var(--card-border); border-radius: 12px; box-shadow: var(--shadow-comic-sm); cursor: pointer; }
    .user-avatar-sm { width: 40px; height: 40px; border-radius: 50%; background: var(--pop-purple); border: var(--card-border); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); color: #111; }
    .user-name-sm { font-weight: 800; font-size: 0.85rem; }
    .user-sub-sm { font-size: 0.65rem; color: var(--color-text-muted); }

    .empty-state { padding: 30px; text-align: center; border: 2px dashed var(--color-text-muted); border-radius: 14px; font-size: 0.8rem; color: var(--color-text-muted); }
    .search-wrap { position: relative; margin-bottom: 10px; }
    .search-wrap svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 18px; color: var(--color-text-muted); }
    .search-input { width: 100%; padding: 12px 12px 12px 40px; border-radius: 10px; border: var(--card-border); background: var(--card-bg); color: var(--ink); }

    /* MODAL STORY VIEWER */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 999; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
    .modal-overlay.show { display: flex; }
    .story-viewer { width: 100%; max-width: 380px; height: 80vh; background: var(--paper); border: var(--card-border); border-radius: 20px; overflow: hidden; position: relative; display: flex; flex-direction: column; }
    .story-img { width: 100%; height: 100%; object-fit: cover; }
    .close-story { position: absolute; top: 15px; right: 15px; width: 35px; height: 35px; border-radius: 50%; background: rgba(0,0,0,0.5); color: #fff; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; z-index: 10; }

    /* BUBBLE NAV */
    .bubble-nav { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); width: calc(100% - 1.5rem); max-width: calc(var(--app-max-width) - 1.5rem); height: var(--nav-height); background: var(--nav-bg); border: var(--card-border); border-radius: 22px; box-shadow: var(--shadow-comic); display: flex; align-items: center; padding: 6px; z-index: 150; touch-action: none; user-select: none; backdrop-filter: blur(10px); }
    .bubble-indicator { position: absolute; top: 6px; height: calc(var(--nav-height) - 12px); border-radius: 16px; background: var(--pop-yellow); border: 2px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); transition: left 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.35s; pointer-events: none; z-index: 1; }
    .bubble-nav.dragging .bubble-indicator { transition: none; transform: scale(1.08); box-shadow: 3px 6px 0 var(--ink); }
    .bubble-nav .nav-item { flex: 1; height: 100%; border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--ink); position: relative; z-index: 2; transition: color 0.25s; }
    .bubble-nav .nav-item svg { width: 22px; height: 22px; transition: transform 0.3s; }
    .bubble-nav .nav-item span { font-size: 0.55rem; font-weight: 800; text-transform: uppercase; }
    .bubble-nav .nav-item.active svg { transform: scale(1.15) translateY(-1px); stroke-width: 2.5; }

    .toast { position: fixed; bottom: calc(var(--nav-height) + 24px); left: 50%; transform: translateX(-50%) translateY(20px); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; border: var(--card-border); box-shadow: var(--shadow-comic-sm); opacity: 0; pointer-events: none; transition: 0.25s; z-index: 300; text-align: center; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.error { background: var(--pop-red); color: #fff; }
    .toast.success { background: var(--pop-blue); color: #111; }
    .loading-overlay { position: fixed; inset: 0; background: var(--paper); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-md); z-index: 500; transition: opacity 0.4s; }
    .loading-overlay.fade-out { opacity: 0; pointer-events: none; }
    .loading-spinner { width: 54px; height: 54px; border: 5px solid var(--paper-dark); border-top-color: var(--pop-blue); border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-family: var(--font-display); font-size: 1.4rem; color: var(--ink); text-shadow: 2px 2px 0 var(--pop-yellow); }
  </style>
</head>
<body>

  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-spinner"></div>
    <div class="loading-text">Memuat Data…</div>
  </div>

  <!-- MODAL LIHAT STORY -->
  <div class="modal-overlay" id="storyModal">
    <div class="story-viewer">
      <button class="close-story" onclick="closeStory()">✕</button>
      <img id="storyImage" class="story-img" src="" alt="Story">
    </div>
  </div>

  <!-- INPUT FILE STORY (Hidden) -->
  <input type="file" id="storyUpload" accept="image/*" class="hidden">

  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <div class="topbar-avatar" id="userAvatar">?</div>
        <div class="topbar-info">
          <div class="topbar-name" id="userName">—</div>
          <div class="topbar-role" id="userRole">—</div>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btnSilence" style="background:var(--pop-purple);color:#fff">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </button>
        <button class="icon-btn" id="btnLogout" style="background:var(--pop-red);color:#fff">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </header>

    <main class="main">
      <!-- 1. HOME (DENGAN STORY) -->
      <section class="screen-panel active" data-screen="home">
        <div class="greet-card">
          <div class="greet-title" id="greetTitle">Halo!</div>
          <span class="greet-badge" id="greetBadge">USER</span>
        </div>

        <!-- STORY SECTION -->
        <div>
          <h3 style="font-family:var(--font-display); font-size:1.2rem; margin-bottom:10px;">Stories</h3>
          <div class="story-container" id="storyContainer">
            <!-- Diisi via JS -->
          </div>
        </div>

        <div class="stats-row">
          <div class="stat-card"><div class="stat-num">0</div><div class="stat-lbl">Followers</div></div>
          <div class="stat-card"><div class="stat-num">0</div><div class="stat-lbl">Likes</div></div>
          <div class="stat-card"><div class="stat-num">0</div><div class="stat-lbl">Following</div></div>
        </div>
      </section>

      <!-- 2. SOCIAL (CHAT ONLY) -->
      <section class="screen-panel" data-screen="social">
        <h1 class="page-title">Social</h1>
        
        <div class="subtabs" id="socialSubtabs">
          <button class="subtab active" data-subtab="chat">Private Chat</button>
          <button class="subtab" data-subtab="global">Global Chat</button>
          <button class="subtab" data-subtab="search">Cari User</button>
        </div>

        <!-- PRIVATE CHAT -->
        <div id="sub-chat">
          <div id="chatListView">
            <div class="user-list" id="chatList"><div class="empty-state">Memuat chat…</div></div>
          </div>
          <div id="chatView" class="hidden">
            <div class="chat-view">
              <div class="chat-head">
                <button class="chat-back" id="chatBack"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
                <div class="chat-name" id="chatName">—</div>
              </div>
              <div class="chat-messages" id="chatMessages"></div>
              <div class="chat-input">
                <input type="text" id="chatInput" placeholder="Tulis pesan..." autocomplete="off">
                <button class="chat-send" id="chatSend"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
              </div>
            </div>
          </div>
        </div>

        <!-- GLOBAL CHAT -->
        <div id="sub-global" class="hidden">
          <div class="chat-view" style="height: calc(100dvh - var(--nav-height) - 200px);">
            <div class="chat-head" style="background:var(--pop-purple); color:#fff; border-color:var(--ink);">
              <div class="chat-name" style="width:100%; text-align:center;">🌍 Global Room</div>
            </div>
            <div class="chat-messages" id="globalMessages"><div class="empty-state">Memuat chat global…</div></div>
            <div class="chat-input">
              <input type="text" id="globalInput" placeholder="Kirim pesan ke semua orang..." autocomplete="off">
              <button class="chat-send" id="globalSend"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
            </div>
          </div>
        </div>

        <!-- SEARCH -->
        <div id="sub-search" class="hidden">
          <div class="search-wrap">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" class="search-input" id="searchInput" placeholder="Cari user...">
          </div>
          <div id="searchResults"><div class="empty-state">Ketik untuk mencari.</div></div>
        </div>
      </section>

      <!-- 3. PREMIUM -->

  <script>
    const SUPABASE_URL      = 'https://lxdjnzsbunkkwjkltabt.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_W9AFHz0Z3M0YhpVRgLsbbQ_L8iUd-q1';

    let supaClient = null;
    let currentUser = null;
    let userRole = 'user';
    let activeChatUser = null;
    let searchTimeout;

    let toastTimer;
    function toast(msg, type = '') {
      const el = document.getElementById('toast');
      el.textContent = msg; el.className = 'toast show ' + type;
      clearTimeout(toastTimer); toastTimer = setTimeout(() => el.className = 'toast ' + type, 3000);
    }
    function hideLoading() {
      const o = document.getElementById('loadingOverlay');
      if (o) { o.classList.add('fade-out'); setTimeout(() => o.remove(), 400); }

    function escapeHtml(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
    function getTimeNow(ts) { return new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' }); }

    async function initSupa() {
      return new Promise((resolve) => {
        if (window.supabase && window.supabase.createClient) {
          supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          resolve(true); return;
        }
        let tries = 0;
        const timer = setInterval(() => {
          tries++;
          if (window.supabase && window.supabase.createClient) {
            clearInterval(timer); supaClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); resolve(true);
          }
          if (tries >= 80) { clearInterval(timer); resolve(false); }
        }, 100);
      });
    }

    /* TEMA */
    function applyTheme(themeName) {
      document.documentElement.setAttribute('data-theme', themeName);
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.setTheme === themeName));
      localStorage.setItem('dx_theme', themeName);
    }
    function initTheme() {
      const saved = localStorage.getItem('dx_theme') || 'classic';
      if ((saved === 'imyut' || saved === 'comic') && (userRole !== 'premium' && userRole !== 'owner')) applyTheme('classic');
      else applyTheme(saved);
    }
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.setTheme;
        const isPrem = btn.dataset.premium === 'true';
        if (isPrem && (userRole !== 'premium' && userRole !== 'owner')) return toast('Tema ini khusus Premium / Owner!', 'error');
        applyTheme(target); toast(`Tema diubah ke ${target.toUpperCase()}`, 'success');
      });

    /* SUBTABS SOCIAL */
    document.querySelectorAll('#socialSubtabs .subtab').forEach(t => {
      t.addEventListener('click', () => {
        document.querySelectorAll('#socialSubtabs .subtab').forEach(x => x.classList.remove('active'));
        t.classList.add('active');
        const target = t.dataset.subtab;
        document.getElementById('sub-chat').classList.toggle('hidden', target !== 'chat');
        document.getElementById('sub-global').classList.toggle('hidden', target !== 'global');
        document.getElementById('sub-search').classList.toggle('hidden', target !== 'search');
        
        if(target === 'global') { 
          const gm = document.getElementById('globalMessages'); gm.scrollTop = gm.scrollHeight; 
        }
      });

    /* BUBBLE NAV */
    (function bubbleNav() {
      const nav = document.getElementById('bubbleNav');
      const indicator = document.getElementById('bubbleIndicator');
      const items = Array.from(nav.querySelectorAll('.nav-item'));
      const panels = document.querySelectorAll('.screen-panel');
      let activeIndex = 0, isDragging = false, isLongPress = false, startX = 0, currentX = 0, longPressTimer = null, startIndex = 0;

      function positionIndicator(index, animate = true) {
        const item = items[index]; if (!item) return;
        const navRect = nav.getBoundingClientRect(); const itemRect = item.getBoundingClientRect();
        if (!animate) indicator.style.transition = 'none'; else indicator.style.transition = '';
        indicator.style.left = (itemRect.left - navRect.left) + 'px'; indicator.style.width = itemRect.width + 'px';
      }
      function setActive(index, animate = true) {
        if (index < 0) index = 0; if (index >= items.length) index = items.length - 1;
        activeIndex = index;
        items.forEach((it, i) => it.classList.toggle('active', i === index));
        positionIndicator(index, animate);
        panels.forEach(p => p.classList.toggle('active', p.dataset.screen === items[index].dataset.target));
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      function indexFromX(x) {
        const navRect = nav.getBoundingClientRect(); const relX = x - navRect.left;
        let closest = 0, minDist = Infinity;
        items.forEach((item, i) => {
          const r = item.getBoundingClientRect(); const center = (r.left - navRect.left) + r.width / 2;
          const dist = Math.abs(relX - center); if (dist < minDist) { minDist = dist; closest = i; }
        });
        return closest;
      }
      function previewBubble(x) {
        const index = indexFromX(x); if (index === activeIndex) return;
        const item = items[index]; if (!item) return;
        const navRect = nav.getBoundingClientRect(); const itemRect = item.getBoundingClientRect();
        indicator.style.left = (itemRect.left - navRect.left) + 'px'; indicator.style.width = itemRect.width + 'px';
      }
      function onStart(e) {
        if (e.type === 'mousedown' && e.button !== 0) return;
        const point = e.touches ? e.touches[0] : e;
        startX = point.clientX; currentX = startX; startIndex = indexFromX(startX);
        isDragging = false; isLongPress = false;
        const item = items[startIndex]; if (item) item.classList.add('pressing');
        longPressTimer = setTimeout(() => {
          isLongPress = true; nav.classList.add('dragging');
          items.forEach(it => it.classList.remove('pressing'));
          if (navigator.vibrate) navigator.vibrate(15);
        }, 150);
        window.addEventListener('mousemove', onMove); window.addEventListener('mouseup', onEnd);
        window.addEventListener('touchmove', onMove, { passive: false }); window.addEventListener('touchend', onEnd); window.addEventListener('touchcancel', onEnd);
      }
      function onMove(e) {
        const point = e.touches ? e.touches[0] : e; const dx = point.clientX - startX;
        if (!isLongPress && Math.abs(dx) > 8) {
          clearTimeout(longPressTimer); items.forEach(it => it.classList.remove('pressing'));
          if (Math.abs(dx) > 10) { isLongPress = true; nav.classList.add('dragging'); }
        }
        if (isLongPress) { if (e.cancelable) e.preventDefault(); currentX = point.clientX; previewBubble(currentX); }
      }
      function onEnd() {
        clearTimeout(longPressTimer); items.forEach(it => it.classList.remove('pressing'));
        window.removeEventListener('mousemove', onMove); window.removeEventListener('mouseup', onEnd);
        window.removeEventListener('touchmove', onMove); window.removeEventListener('touchend', onEnd); window.removeEventListener('touchcancel', onEnd);
        if (isLongPress) { setActive(indexFromX(currentX)); nav.classList.remove('dragging'); }
        else { const t = indexFromX(startX); if (t !== activeIndex) setActive(t); }
      }
      nav.addEventListener('mousedown', onStart); nav.addEventListener('touchstart', onStart, { passive: false });
      nav.addEventListener('contextmenu', e => e.preventDefault()); window.addEventListener('resize', () => positionIndicator(activeIndex, false));
      setTimeout(() => positionIndicator(activeIndex, false), 100);
    })();

    /* ============================================================
       LOGIC STORY
       ============================================================ */
    async function loadStories() {
      const container = document.getElementById('storyContainer');
      
      // Tambah tombol "Buat Story" di paling kiri
      let html = `
        <div class="story-item" onclick="document.getElementById('storyUpload').click()">
          <div class="story-circle add-new">+</div>
          <div class="story-name">Buat Story</div>
        </div>
      `;
      
      try {
        // Ambil story dari 24 jam terakhir
        const yesterday = new Date(Date.now() - 24 * 60 * 60 * 1000).toISOString();
        const { data: stories, error } = await supaClient.from('stories')
          .select('*')
          .gte('created_at', yesterday)
          .order('created_at', { ascending: false });
          
        if (error) throw error;
        
        if (stories && stories.length > 0) {
          // Ambil data profil pembuat story
          const userIds = [...new Set(stories.map(s => s.user_id))];
          const { data: profiles } = await supaClient.from('profiles').select('id, nickname').in('id', userIds);
          const pMap = {}; (profiles || []).forEach(p => pMap[p.id] = p.nickname);
          
          html += stories.map(s => {
            const author = pMap[s.user_id] || 'User';
            // Cuma ambil 1 story per user biar gak numpuk (opsional)
            return `
              <div class="story-item" onclick="viewStory('${s.media_url}')">
                <div class="story-circle">
                  <img src="${s.media_url}" alt="Story">
                </div>
                <div class="story-name">${escapeHtml(author)}</div>
              </div>
            `;
          }).join('');
        }
      } catch(e) {
        console.error("Gagal load story", e);
      }
      
      container.innerHTML = html;
    }

    // Upload Story
    document.getElementById('storyUpload').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) return toast('Maksimal foto 3MB', 'error');
      
      const reader = new FileReader();
      reader.onload = async () => {
        const base64 = reader.result;
        const { error } = await supaClient.from('stories').insert({
          user_id: currentUser.id,
          media_url: base64
        });
        
        if (error) return toast('Gagal upload story: ' + error.message, 'error');
        toast('Story berhasil diupload!', 'success');
        loadStories();
      };
      reader.readAsDataURL(file);
    });

    // Lihat Story
    window.viewStory = (url) => {
      document.getElementById('storyImage').src = url;
      document.getElementById('storyModal').classList.add('show');
    };
    window.closeStory = () => {
      document.getElementById('storyModal').classList.remove('show');
    };

    /* ============================================================
       LOGIC PRIVATE CHAT
       ============================================================ */
    async function loadChatList() {
      const c = document.getElementById('chatList');
      try {
        const { data: profiles } = await supaClient.from('profiles').select('id, nickname, role').neq('id', currentUser.id).limit(30);
        if (!profiles || profiles.length === 0) { c.innerHTML = `<div class="empty-state">Belum ada user lain.</div>`; return; }
        c.innerHTML = profiles.map(p => `
          <div class="user-row" onclick="openChat('${p.id}', '${escapeHtml(p.nickname)}')">
            <div class="user-avatar-sm">${p.nickname.charAt(0).toUpperCase()}</div>
            <div class="user-info-sm">
              <div class="user-name-sm">${escapeHtml(p.nickname)}</div>
              <div class="user-sub-sm">${p.role||'user'}</div>
            </div>
          </div>
        `).join('');
      } catch(e) { c.innerHTML = `<div class="empty-state">Gagal memuat chat.</div>`; }
    }

    document.getElementById('chatBack').addEventListener('click', () => {
      document.getElementById('chatView').classList.add('hidden'); document.getElementById('chatListView').classList.remove('hidden'); activeChatUser = null;
    });

    window.openChat = (id, nick) => {
      activeChatUser = { id, nick }; document.getElementById('chatListView').classList.add('hidden'); document.getElementById('chatView').classList.remove('hidden'); document.getElementById('chatName').textContent = nick; loadMessages();
    }

    async function loadMessages() {
      if (!activeChatUser) return; const c = document.getElementById('chatMessages');
      try {
        const { data: msgs } = await supaClient.from('messages').select('*').or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${activeChatUser.id}),and(sender_id.eq.${activeChatUser.id},receiver_id.eq.${currentUser.id})`).order('created_at', { ascending: true }).limit(100);
        if (!msgs || msgs.length === 0) { c.innerHTML = `<div class="empty-state" style="margin:auto">Belum ada pesan.</div>`; return; }
        c.innerHTML = msgs.map(m => { const isMe = m.sender_id === currentUser.id; return `<div class="msg ${isMe?'me':'them'}">${escapeHtml(m.text)}<div class="msg-time">${getTimeNow(m.created_at)}</div></div>`; }).join('');
        c.scrollTop = c.scrollHeight;
      } catch(e) { c.innerHTML = `<div class="empty-state" style="margin:auto">Gagal memuat pesan.</div>`; }
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput'); const txt = input.value.trim(); if (!txt || !activeChatUser) return;
      input.value = '';
      const { error } = await supaClient.from('messages').insert({ sender_id: currentUser.id, receiver_id: activeChatUser.id, text: txt });
      if (error) return toast('Gagal kirim', 'error'); loadMessages();
    }

    document.getElementById('chatSend').addEventListener('click', sendMessage);
    document.getElementById('chatInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

    /* ============================================================
       LOGIC GLOBAL CHAT (ZERO DELAY)
       ============================================================ */
    async function loadGlobalChat() {
      const c = document.getElementById('globalMessages');
      try {
        const { data: msgs, error } = await supaClient.from('global_messages').select('*').order('created_at', { ascending: true }).limit(50);
        if (error) throw error;
        if (!msgs || msgs.length === 0) { c.innerHTML = `<div class="empty-state" style="margin:auto">Belum ada obrolan.</div>`; }
        else {
          const userIds = [...new Set(msgs.map(m => m.user_id))];
          const { data: profiles } = await supaClient.from('profiles').select('id, nickname').in('id', userIds);
          const pMap = {}; (profiles||[]).forEach(p => pMap[p.id] = p.nickname);

          c.innerHTML = msgs.map(m => {
            const isMe = m.user_id === currentUser.id;
            const authorName = isMe ? 'Kamu' : (pMap[m.user_id] || 'User');
            const showName = !isMe ? `<div class="msg-sender">${escapeHtml(authorName)}</div>` : '';
            return `<div class="msg ${isMe?'me':'them'}">${showName}${escapeHtml(m.text)}<div class="msg-time">${getTimeNow(m.created_at)}</div></div>`;
          }).join('');
        }
        c.scrollTop = c.scrollHeight;

        // Realtime Listener
        if (!globalChannel) {
          globalChannel = supaClient.channel('public:global_messages')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'global_messages' }, async (payload) => {
              const newMsg = payload.new;
              if (document.getElementById('sub-global').classList.contains('hidden')) return;
              
              // Cek apakah pesan ini udah dirender sama Optimistic UI (punya kita sendiri)
              if (document.getElementById('msg-' + newMsg.id)) return;

              const { data: prof } = await supaClient.from('profiles').select('nickname').eq('id', newMsg.user_id).maybeSingle();
              const authorName = newMsg.user_id === currentUser.id ? 'Kamu' : (prof?.nickname || 'User');
              const showName = newMsg.user_id !== currentUser.id ? `<div class="msg-sender">${escapeHtml(authorName)}</div>` : '';
              
              if (c.querySelector('.empty-state')) c.innerHTML = '';
              c.insertAdjacentHTML('beforeend', `<div class="msg ${newMsg.user_id === currentUser.id ? 'me' : 'them'}" id="msg-${newMsg.id}">${showName}${escapeHtml(newMsg.text)}<div class="msg-time">${getTimeNow(newMsg.created_at)}</div></div>`);
              c.scrollTop = c.scrollHeight;
            }).subscribe();
        }
      } catch(e) { console.error(e); c.innerHTML = `<div class="empty-state" style="margin:auto">Gagal memuat chat global.</div>`; }
    }

    // KIRIM PESAN INSTAN (TANPA DELAY)
    async function sendGlobalMessage() {
      const input = document.getElementById('globalInput');
      const txt = input.value.trim();
      if (!txt) return;
      input.value = '';

      const c = document.getElementById('globalMessages');
      if (c.querySelector('.empty-state')) c.innerHTML = '';

      // 1. Render Instan ke Layar (Optimistic UI)
      const tempId = 'temp-' + Date.now();
      c.insertAdjacentHTML('beforeend', `
        <div class="msg me" id="${tempId}">
          ${escapeHtml(txt)}
          <div class="msg-time">Mengirim...</div>
        </div>
      `);
      c.scrollTop = c.scrollHeight;

      // 2. Kirim ke Database di belakang layar
      const { data, error } = await supaClient.from('global_messages').insert({ user_id: currentUser.id, text: txt }).select().single();
      
      const tempEl = document.getElementById(tempId);

      if (error) {
        toast('Gagal kirim: ' + error.message, 'error');
        if (tempEl) tempEl.querySelector('.msg-time').textContent = 'Gagal terkirim';
      } else {
        // 3. Update status di UI jadi waktu asli
        if (tempEl) {
          tempEl.id = 'msg-' + data.id; // Ganti ID biar gak double render sama Realtime
          tempEl.querySelector('.msg-time').textContent = getTimeNow(data.created_at);
        }
      }
    }

    document.getElementById('globalSend').addEventListener('click', sendGlobalMessage);
    document.getElementById('globalInput').addEventListener('keydown', e => { if (e.key === 'Enter') sendGlobalMessage(); });

      try {
        const { data: profiles } = await supaClient.from('profiles').select('id, nickname, role').ilike('nickname', `%${q}%`).limit(20);
        if (!profiles || profiles.length === 0) { c.innerHTML = `<div class="empty-state">User tidak ditemukan.</div>`; return; }
        
        c.innerHTML = `<div class="user-list">` + profiles.map(p => `
          <div class="user-row" onclick="document.querySelector('[data-subtab=\\'chat\\']').click(); openChat('${p.id}', '${escapeHtml(p.nickname)}')">
            <div class="user-avatar-sm">${p.nickname.charAt(0).toUpperCase()}</div>
            <div class="user-info-sm">
              <div class="user-name-sm">${escapeHtml(p.nickname)}</div>
              <div class="user-sub-sm">${p.role||'user'}</div>
            </div>
          </div>
        `).join('') + `</div>`;
      } catch(e) { c.innerHTML = `<div class="empty-state">Gagal mencari.</div>`; }
    }

    /* BOOT DASHBOARD */
    async function boot() {
      console.log("1. Memulai Boot...");
      const ok = await initSupa();
      if (!ok) { toast('Koneksi ke Supabase gagal.', 'error'); hideLoading(); return; }
      try {
        const { data: { session } } = await supaClient.auth.getSession();
        if (!session) { window.location.href = 'login.html'; return; }
        currentUser = session.user;

        const { data: profile } = await supaClient.from('profiles').select('nickname, role').eq('id', currentUser.id).maybeSingle();
        userRole = profile?.role || 'user';
        const nickname = profile?.nickname || currentUser.user_metadata?.nickname || currentUser.email.split('@')[0];
        
        const safeSetText = (id, text) => { const el = document.getElementById(id); if (el) el.textContent = text; };
        const safeSetHTML = (id, html) => { const el = document.getElementById(id); if (el) el.innerHTML = html; };

        let nameHtml = nickname;
        if (userRole === 'premium' || userRole === 'owner') {
          nameHtml += ` <span class="badge-verified"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>`;
          const pText = document.getElementById('premiumStatusText');
          if(pText) { pText.textContent = "Kamu udah Premium! Semua fitur kebuka."; pText.style.color = "var(--ink)"; pText.style.fontWeight="900"; }
        }

        safeSetText('userAvatar', nickname.charAt(0).toUpperCase());
        safeSetHTML('userName', nameHtml);
        safeSetText('userRole', userRole.toUpperCase());
        safeSetHTML('greetTitle', `Halo, ${nameHtml}!`);
        safeSetText('greetBadge', userRole.toUpperCase());

        safeSetText('setNickname', nickname);
        safeSetText('setRole', userRole.toUpperCase());

        initTheme();
        loadStories().catch(e => console.error(e));
        loadChatList().catch(e => console.error(e));
        loadGlobalChat().catch(e => console.error(e));

      } catch (err) { console.error(err); toast('Error sistem: ' + err.message, 'error'); }
      finally { hideLoading(); }
    }

    document.addEventListener('DOMContentLoaded', () => {
      boot();
      const doLogout = async () => { if (supaClient) await supaClient.auth.signOut(); window.location.href = 'login.html'; };
      document.getElementById('btnLogout').addEventListener('click', doLogout);
      document.getElementById('btnLogout2').addEventListener('click', doLogout);
      document.getElementById('btnSilence').addEventListener('click', () => window.location.href = 'silence.html');
    });
  </script>
</body>
</html>
